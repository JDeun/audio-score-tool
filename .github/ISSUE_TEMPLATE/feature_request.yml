name: Feature request
description: 사용자 문제와 기대 결과를 중심으로 기능을 제안합니다.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 기능 이름보다 현재 어떤 작업이 어렵거나 불가능한지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 원하는 동작이나 UX를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 현재 workaround 또는 다른 접근이 있다면 적어 주세요.
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - Desktop UI / Editor
        - Audio / YouTube transcription
        - PDF / Image OMR
        - MusicXML / MIDI import
        - Validation / Enrichment
        - Storage / Revision / Export
        - Packaging / Updater
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 호환성 / 데이터 / 라이선스 영향
      description: DB schema, public API, 모델/weights, 외부 도구, 배포 방식에 영향이 예상되면 적어 주세요.
  - type: checkboxes
    id: checks
    attributes:
      label: 확인
      options:
        - label: 기존 Issue와 문서를 검색했습니다.
          required: true
        - label: 문제와 기대 결과를 재현 가능하게 설명했습니다.
          required: true