name: CPU Frozen nASAP Joint Decoder on New Compositions

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - research/nasap-joint-voice-rest-20261112
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cpu-nasap-joint-holdout-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: '0'
  CUDA_VISIBLE_DEVICES: ''
  HF_TOKEN: ''
  HUGGING_FACE_HUB_TOKEN: ''
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'

jobs:
  composition-disjoint:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Install pinned CPU-only MIDI and regression runtime
        run: |
          python -m pip install --disable-pip-version-check mido==1.3.3 pytest==8.4.2 ruff==0.16.6
          python -m pip check
      - name: Check composition separation and unchanged decoding contracts
        run: |
          python -m ruff check scripts/nasap_joint_holdout.py tests/test_nasap_joint_holdout.py
          python -m compileall -q scripts/nasap_joint_holdout.py
          python -m pytest -q tests/test_nasap_joint_holdout.py tests/test_nasap_joint_rhythm.py tests/test_nasap_keyoff_paired.py tests/test_nasap_duration_probe.py tests/test_nasap_duration_source.py
      - name: Read immutable preceding study with read-only job permission
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/artifacts/13911212291/zip" > "$RUNNER_TEMP/nasap-joint-prior.zip"
          printf '%s  %s\n' '224dd43e067bdfbb87d1e0ef9c1af48baaf5ccd385c259c388ab69f543fd55e4' "$RUNNER_TEMP/nasap-joint-prior.zip" | sha256sum --check
      - name: Evaluate fixed six arms on preregistered new compositions
        run: |
          mkdir -p "$RUNNER_TEMP/nasap-joint-holdout"
          python -m scripts.nasap_joint_holdout --previous "$RUNNER_TEMP/nasap-joint-prior.zip" --output "$RUNNER_TEMP/nasap-joint-holdout/report.json"
      - name: Include our code and protocol without musical source files
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/nasap-joint-holdout/reproduction/scripts" "$RUNNER_TEMP/nasap-joint-holdout/reproduction/tests" "$RUNNER_TEMP/nasap-joint-holdout/reproduction/docs/research"
          cp scripts/nasap_joint_holdout.py scripts/nasap_joint_rhythm.py scripts/nasap_keyoff_paired.py scripts/nasap_duration_probe.py scripts/audit_nasap_duration_source.py "$RUNNER_TEMP/nasap-joint-holdout/reproduction/scripts/"
          cp tests/test_nasap_joint_holdout.py tests/test_nasap_joint_rhythm.py tests/test_nasap_keyoff_paired.py tests/test_nasap_duration_probe.py tests/test_nasap_duration_source.py "$RUNNER_TEMP/nasap-joint-holdout/reproduction/tests/"
          cp docs/research/NASAP_JOINT_HOLDOUT_PROTOCOL_2026-11-12.md "$RUNNER_TEMP/nasap-joint-holdout/reproduction/docs/research/"
      - name: Upload derived receipt and our experiment code only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nasap-joint-holdout-${{ github.run_id }}
          path: ${{ runner.temp }}/nasap-joint-holdout/
          if-no-files-found: warn
          retention-days: 14
