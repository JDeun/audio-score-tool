name: CPU GMD Drum Meter and Metadata Study

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - research/bar-sum-articulation-audio-20261111
    paths:
      - '.github/workflows/cpu-gmd-drum-meter.yml'
      - 'scripts/drum_meter_probe.py'
      - 'scripts/run_drum_meter_probe.py'
      - 'tests/test_drum_meter_probe.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-gmd-drum-meter-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  CUDA_VISIBLE_DEVICES: ''
  HF_TOKEN: ''
  HUGGING_FACE_HUB_TOKEN: ''
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'

jobs:
  gmd:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Pinned CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 mido==1.3.3 pytest==8.4.2 ruff==0.16.6
          python -m pip check
      - name: Lint and test time units, matched recording gate and 3/4-4/4 hypotheses
        run: |
          python -m ruff check scripts/drum_meter_probe.py scripts/run_drum_meter_probe.py tests/test_drum_meter_probe.py
          python -m compileall -q scripts/drum_meter_probe.py scripts/run_drum_meter_probe.py
          python -m pytest -q tests/test_drum_meter_probe.py
      - name: Download only the pinned original human-performance MIDI dataset
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --max-time 240 --retry 3 --max-filesize 8000000 \
            'https://storage.googleapis.com/magentadata/datasets/groove/groove-v1.0.0-midionly.zip' \
            --output "$RUNNER_TEMP/groove-v1.0.0-midionly.zip"
          printf '%s  %s\n' '651cbc524ffb891be1a3e46d89dc82a1cecb09a57c748c7b45b844c4841dcc1e' "$RUNNER_TEMP/groove-v1.0.0-midionly.zip" | sha256sum --check
      - name: Compare blind drum events with BPM-only and full metadata constraints
        run: |
          mkdir -p "$RUNNER_TEMP/gmd-report"
          python -m scripts.run_drum_meter_probe \
            --archive "$RUNNER_TEMP/groove-v1.0.0-midionly.zip" \
            --report "$RUNNER_TEMP/gmd-report/report.json"
      - name: Upload aggregate metadata only, not performer MIDI or recordings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gmd-drum-meter-${{ github.run_id }}
          path: ${{ runner.temp }}/gmd-report/report.json
          if-no-files-found: warn
          retention-days: 14
