name: CPU Tempo Consensus and Alias Abstention

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - research/tempo-only-pattern-20261111
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tempo-consensus-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: '0'
  CUDA_VISIBLE_DEVICES: ''
  HF_TOKEN: ''
  HUGGING_FACE_HUB_TOKEN: ''
  OPENBLAS_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'

jobs:
  study:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [midi, audio]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 mido==1.3.3 pytest==8.4.2 ruff==0.16.6
          python -m pip check
      - name: Validate no-label interfaces, exact prior baseline and alias accounting
        run: |
          python -m ruff check scripts/tempo_consensus_probe.py scripts/run_tempo_consensus_probe.py tests/test_tempo_consensus_probe.py
          python -m compileall -q scripts/tempo_consensus_probe.py scripts/run_tempo_consensus_probe.py
          python -m pytest -q tests/test_tempo_consensus_probe.py
      - name: Fetch only checksum-bound original MIDI metadata
        run: |
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --max-time 240 --retry 3 --max-filesize 8000000 \
            'https://storage.googleapis.com/magentadata/datasets/groove/groove-v1.0.0-midionly.zip' \
            --output "$RUNNER_TEMP/gmd-midi.zip"
          printf '%s  %s\n' '651cbc524ffb891be1a3e46d89dc82a1cecb09a57c748c7b45b844c4841dcc1e' "$RUNNER_TEMP/gmd-midi.zip" | sha256sum --check
      - name: Compare fixed consensus and selective policies before reference scoring
        run: |
          mkdir -p "$RUNNER_TEMP/consensus-report"
          python -m scripts.run_tempo_consensus_probe --mode '${{ matrix.mode }}' \
            --archive "$RUNNER_TEMP/gmd-midi.zip" --report "$RUNNER_TEMP/consensus-report/report.json"
      - name: Upload metadata only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tempo-consensus-${{ matrix.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/consensus-report/report.json
          retention-days: 14
          if-no-files-found: warn
