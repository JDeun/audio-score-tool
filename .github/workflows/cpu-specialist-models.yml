name: CPU Specialist Model Diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/cpu-specialist-models.yml'
      - 'scripts/run_cpu_specialists.py'
      - 'tests/test_cpu_specialists.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-specialists-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUNBUFFERED: '1'
  PYTHONHASHSEED: '0'
  CUDA_VISIBLE_DEVICES: ''
  HF_TOKEN: ''
  HUGGING_FACE_HUB_TOKEN: ''
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  TORCH_FORCE_WEIGHTS_ONLY_LOAD: '1'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  NUMBA_NUM_THREADS: '2'

jobs:
  specialist:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    name: CPU / ${{ matrix.candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        candidate: [piano, stringnet, beat_this]
    env:
      CANDIDATE: ${{ matrix.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Install pinned CPU evaluation runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'setuptools==79.0.1' 'numpy==1.26.4' 'scipy==1.13.1' \
            'librosa==0.10.2.post1' 'soundfile==0.13.1' 'numba==0.60.0' \
            'mir-eval==0.8.2' 'pretty-midi==0.2.10' 'mido==1.3.3' \
            'pytest==8.4.2' 'resampy==0.4.2' 'matplotlib==3.9.4'
          python -m pip install 'torch==2.7.1' 'torchaudio==2.7.1' \
            --index-url https://download.pytorch.org/whl/cpu
          if [[ "$CANDIDATE" == piano ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y fluidsynth timgm6mb-soundfont
            python -m pip install 'onnxruntime==1.20.1'
            python -m pip install --no-deps 'basic-pitch==0.4.0' 'torchlibrosa==0.1.0' \
              'piano-transcription-inference @ git+https://github.com/qiuqiangkong/piano_transcription_inference.git@0226e74cbc805660e34bbd6a8fed2083890ebb88'
          elif [[ "$CANDIDATE" == beat_this ]]; then
            python -m pip install 'einops==0.8.1' 'rotary-embedding-torch==0.8.6' 'soxr==0.5.0.post1'
            python -m pip install --no-deps \
              'beat-this @ git+https://github.com/CPJKU/beat_this.git@b95c8ab0c58c2d9fcfd40508ae8dffbc05ac4f5c'
          fi
      - name: Test source integrity and role-specific scoring before inference
        run: python -m pytest -q tests/test_cpu_specialists.py
      - name: Run real pretrained CPU models on the predeclared diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.run_cpu_specialists --candidate "$CANDIDATE" \
            --work "$RUNNER_TEMP/ast-specialist-$CANDIDATE" \
            --report "$RUNNER_TEMP/ast-specialist-reports/$CANDIDATE.json"
      - name: Upload metadata only, never audio, note events, MIDI or weights
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: specialist-${{ matrix.candidate }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ast-specialist-reports/${{ matrix.candidate }}.json
          if-no-files-found: warn
          retention-days: 14
