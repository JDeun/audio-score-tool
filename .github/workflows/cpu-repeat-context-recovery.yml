name: CPU Repeat Context Recovery

on:
  push:
    branches: ['research/repeat-context-20261113']
    paths:
      - '.github/workflows/cpu-repeat-context-recovery.yml'
      - 'scripts/run_repeat_context_recovery.py'
      - 'tests/test_run_repeat_context_recovery.py'
      - 'docs/research/REPEAT_CONTEXT_RECOVERY_2026-11-13.md'

permissions:
  contents: read

concurrency:
  group: repeat-context-recovery-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: '0'
  CUDA_VISIBLE_DEVICES: ''
  HF_TOKEN: ''
  HUGGING_FACE_HUB_TOKEN: ''
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  EXPERIMENT_HEAD: ${{ github.sha }}

jobs:
  recovery:
    if: github.repository == 'JDeun/audio-score-tool'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install the unchanged parser and pinned contract tools
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            mido==1.3.3 pytest==8.4.2 ruff==0.16.6
      - name: Validate explicit replay and compact publication contracts
        run: |
          python -m ruff check scripts/run_repeat_context_recovery.py tests/test_run_repeat_context_recovery.py
          python -m compileall -q scripts/run_repeat_context_recovery.py
          mkdir -p "$RUNNER_TEMP/repeat-context-recovery-tests"
          cp tests/test_run_repeat_context_recovery.py "$RUNNER_TEMP/repeat-context-recovery-tests/"
          python -m pytest -q -p no:cacheprovider -c /dev/null "$RUNNER_TEMP/repeat-context-recovery-tests"
      - name: Replay every original private file before compact result publication
        run: |
          python -m scripts.run_repeat_context_recovery \
            --work "$RUNNER_TEMP/private-repeat-context-recovery" \
            --output "$RUNNER_TEMP/repeat-context-recovery-report/report.json"
      - name: Retain a full planned population if recovery cannot start
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ['RUNNER_TEMP']) / 'repeat-context-recovery-report/report.json'
          if not output.exists():
              output.parent.mkdir(parents=True, exist_ok=True)
              plan = {
                  'reused_authored': [f'syn{i:03d}' for i in range(1, 485)],
                  'factorial_authored': [f'fac{i:04d}' for i in range(1, 1029)],
                  'reused_real': [f'nasap{i:03d}' for i in range(1, 5)],
                  'additional_real': [f'nasap{i:03d}' for i in range(5, 9)],
              }
              report = {
                  'schema_version': 1, 'status': 'execution_not_started',
                  'failure_stage': 'workflow_preparation_or_contracts',
                  'reason': 'A required workflow step failed before a recovery receipt was available.',
                  'expected_scope_case_counts': {scope: len(ids) for scope, ids in plan.items()},
                  'planned_inferences': 1520, 'completed_inferences': 0,
                  'completed_preservation_checks': 0,
                  'planned_ids': [tid for ids in plan.values() for tid in ids], 'planned_scopes': plan,
                  'cases': [{'id': tid, 'scope': scope, 'status': 'planned',
                             'evaluation_status': 'pending', 'input_file_sha256': None,
                             'prediction_file_sha256': None, 'event_mutation_check_passed': False}
                            for scope, ids in plan.items() for tid in ids],
                  'evaluation': None, 'summary': None, 'evaluation_started': False,
                  'all_predictions_saved_before_evaluation': False,
                  'source_head': os.environ.get('EXPERIMENT_HEAD'),
                  'source_revision': os.environ.get('GITHUB_SHA'),
                  'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
                  'workflow_run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
                  'recovery': {'strategy': 'public_json_whitespace_only',
                               'original_run_id': '43256776331', 'legacy_invocations': 0,
                               'study_evaluations': 0, 'matched_input_files': 0,
                               'matched_prediction_files': 0},
              }
              output.write_text(json.dumps(report, sort_keys=True, separators=(',', ':'), allow_nan=False) + '\n')
          PY
      - name: Upload the bounded compact public receipt only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repeat-context-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/repeat-context-recovery-report/report.json
          retention-days: 14
          if-no-files-found: warn
