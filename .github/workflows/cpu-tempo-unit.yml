name: CPU Tempo Pulse Unit and Playback Invariance

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - research/tempo-beat-model-20261112
    paths:
      - '.github/workflows/cpu-tempo-unit.yml'
      - 'scripts/tempo_unit_probe.py'
      - 'scripts/run_tempo_unit_probe.py'
      - 'tests/test_tempo_unit_probe.py'
      - 'tests/test_tempo_unit_boundaries.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cpu-tempo-unit-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: '0'
  CUDA_VISIBLE_DEVICES: ''
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'

jobs:
  pulse-unit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Install bounded CPU-only test and MIDI runtime
        run: |
          python -m pip install --disable-pip-version-check mido==1.3.3 pytest==8.4.2 ruff==0.16.6
          python -m pip check
      - name: Validate unit arithmetic, missing-pulse controls and XML-MIDI roundtrip
        run: |
          python -m ruff check scripts/tempo_unit_probe.py scripts/run_tempo_unit_probe.py tests/test_tempo_unit_probe.py tests/test_tempo_unit_boundaries.py
          python -m compileall -q scripts/tempo_unit_probe.py scripts/run_tempo_unit_probe.py
          python -m pytest -q tests/test_tempo_unit_probe.py tests/test_tempo_unit_boundaries.py
      - name: Read only the immutable previous model result using the job artifact permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/artifacts/13900383659/zip" > "$RUNNER_TEMP/tempo-unit-source.zip"
          printf '%s  %s\n' 'd62e26589018d0690e65104858ff37cd2763e5c9cce22166cd2b854d80fff08d' "$RUNNER_TEMP/tempo-unit-source.zip" | sha256sum --check
      - name: Execute fixed real-prediction replay and new unit conversion experiments
        run: |
          mkdir -p "$RUNNER_TEMP/tempo-unit-output"
          python -m scripts.run_tempo_unit_probe --receipt "$RUNNER_TEMP/tempo-unit-source.zip" --report "$RUNNER_TEMP/tempo-unit-output/report.json"
      - name: Upload new metadata receipt only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tempo-unit-${{ github.run_id }}
          path: ${{ runner.temp }}/tempo-unit-output/report.json
          retention-days: 14
          if-no-files-found: warn
