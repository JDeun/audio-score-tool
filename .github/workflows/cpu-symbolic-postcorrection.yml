name: CPU Symbolic Postcorrection Admission

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - '.github/workflows/cpu-symbolic-postcorrection.yml'
      - 'scripts/symbolic_postcorrection_probe.py'
      - 'scripts/symbolic_music_runtime_probe.py'
      - 'scripts/requirements-symbolic-mono-cpu.txt'
      - 'tests/test_symbolic_postcorrection_probe.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: symbolic-postcorrection-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
  CUDA_VISIBLE_DEVICES: ''
  HF_TOKEN: ''
  HUGGING_FACE_HUB_TOKEN: ''
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '1'

jobs:
  contracts:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest==8.4.2'
      - name: Reference isolation, candidate ordering and exact representation tests
        run: python -m pytest -q tests/test_symbolic_postcorrection_probe.py
      - name: No-edit/rule and explicit hand-set Markov baselines
        run: |
          python -m scripts.symbolic_postcorrection_probe --arm rules \
            --work "$RUNNER_TEMP/rules-private" --report "$RUNNER_TEMP/reports/rules.json"
          python -m scripts.symbolic_postcorrection_probe --arm markov_hand_prior \
            --work "$RUNNER_TEMP/markov-private" --report "$RUNNER_TEMP/reports/markov_hand_prior.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: symbolic-baselines-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reports/rules.json
            ${{ runner.temp }}/reports/markov_hand_prior.json
          retention-days: 14

  qwen:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: [qwen17, qwen4]
    env:
      ARM: ${{ matrix.arm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'
      - name: Build pinned llama.cpp CPU backend without remote model service
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/llama-src"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$SRC" fetch --depth 1 origin bc098c3cf0aac93e57e9bda9d95e2456acf88894
          git -C "$SRC" checkout --detach FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = bc098c3cf0aac93e57e9bda9d95e2456acf88894
          cmake -S "$SRC" -B "$SRC/build" -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=OFF -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build "$SRC/build" --target llama-server --parallel 2
      - name: Verify official weights and evaluate eight owned cases in both orders
        run: |
          python -m scripts.symbolic_postcorrection_probe --arm "$ARM" \
            --server "$RUNNER_TEMP/llama-src/build/bin/llama-server" \
            --work "$RUNNER_TEMP/$ARM-private" --report "$RUNNER_TEMP/reports/$ARM.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: symbolic-${{ matrix.arm }}-${{ github.run_id }}
          path: ${{ runner.temp }}/reports/${{ matrix.arm }}.json
          if-no-files-found: warn
          retention-days: 14

  music_runtime:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: [melodyt5, mono_rnn]
    env:
      ARM: ${{ matrix.arm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.10'
      - name: Isolated pinned compatibility runtime; no training
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'numpy==1.23.5'
          if [[ "$ARM" == melodyt5 ]]; then
            python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
            python -m pip install 'transformers==4.18.0' 'tokenizers==0.12.1' \
              'huggingface-hub==0.16.4' 'Unidecode==1.3.6'
            python -m pip install --no-deps 'samplings==0.1.7'
            REPO=https://github.com/sanderwood/melodyt5.git
            REV=9fc0e7dd02ba10a77b46f9d4a669451f17885fbc
          else
            python -m pip install -r scripts/requirements-symbolic-mono-cpu.txt
            python -m pip check
            REPO=https://github.com/magenta/magenta.git
            REV=c15687ebd1c1cc12658cd468c737d3c24c02b918
          fi
          git init "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" remote add origin "$REPO"
          git -C "$RUNNER_TEMP/upstream" fetch --depth 1 origin "$REV"
          git -C "$RUNNER_TEMP/upstream" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)" = "$REV"
      - name: Load real pretrained state and test bounded symbolic scoring only
        run: |
          python -m scripts.symbolic_music_runtime_probe --arm "$ARM" \
            --source "$RUNNER_TEMP/upstream" --work "$RUNNER_TEMP/$ARM-private" \
            --report "$RUNNER_TEMP/reports/$ARM.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: symbolic-runtime-${{ matrix.arm }}-${{ github.run_id }}
          path: ${{ runner.temp }}/reports/${{ matrix.arm }}.json
          if-no-files-found: warn
          retention-days: 14
