name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Python lint
        run: uv run ruff check src tests training scripts

      - name: Python tests
        run: uv run pytest -q

      - name: Install frontend
        working-directory: desktop
        run: npm install

      - name: Typecheck and build frontend
        working-directory: desktop
        run: npm run build

      - name: Generate Tauri icons
        working-directory: desktop
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Create CI sidecar placeholder
        run: |
          mkdir -p desktop/src-tauri/binaries
          touch desktop/src-tauri/binaries/audio-score-backend-x86_64-unknown-linux-gnu
          chmod +x desktop/src-tauri/binaries/audio-score-backend-x86_64-unknown-linux-gnu

      - name: Check Tauri shell
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
