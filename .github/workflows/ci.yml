name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.10
          enable-cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy

      - name: Repository forensic hygiene
        run: python scripts/forensic_hygiene.py

      - name: Verify Python lockfile
        run: uv lock --check

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Python dependencies
        run: uv sync --frozen --extra dev

      - name: Python lint
        run: uv run --frozen ruff check src tests training scripts

      - name: Python dependency vulnerability audit
        run: |
          uv export --frozen --no-dev --no-hashes --output-file /tmp/runtime-requirements.txt
          uvx --from pip-audit==2.9.0 pip-audit --strict --requirement /tmp/runtime-requirements.txt

      - name: Adversarial boundary and recovery stress gate
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Adversarial stress pass ${attempt}/3"
            uv run --frozen pytest -q \
              tests/test_adversarial_boundaries.py \
              tests/test_adversarial_state_recovery.py \
              tests/test_managed_components.py \
              tests/test_managed_component_tamper.py \
              tests/test_runner_adversarial.py \
              tests/test_direct_score_import.py::test_malformed_midi_failure_is_contained_to_job \
              tests/test_youtube.py::test_validate_youtube_url_rejects_credential_and_ssrf_like_inputs
          done

      - name: Concurrency and recovery soak gate
        run: uv run --frozen pytest -q tests/test_concurrency_soak.py

      - name: Music adversarial benchmark gate
        run: |
          uv run --frozen python scripts/run_music_adversarial_benchmark.py \
            --output /tmp/music-adversarial-benchmark.json

      - name: Python tests (warnings are errors)
        run: uv run --frozen pytest -q

      - name: Install frontend
        working-directory: desktop
        run: npm ci --loglevel=error

      - name: Frontend dependency vulnerability audit
        working-directory: desktop
        run: npm audit --audit-level=high

      - name: Typecheck and build frontend
        working-directory: desktop
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: desktop
        run: npx --no-install playwright install --with-deps chromium

      - name: Accessibility and visual-contract E2E
        working-directory: desktop
        run: npm run test:e2e

      - name: Generate Tauri icons
        working-directory: desktop
        run: npx --no-install tauri icon src-tauri/app-icon.svg

      - name: Create CI sidecar placeholder
        run: |
          mkdir -p desktop/src-tauri/binaries
          touch desktop/src-tauri/binaries/audio-score-backend-x86_64-unknown-linux-gnu
          chmod +x desktop/src-tauri/binaries/audio-score-backend-x86_64-unknown-linux-gnu

      - name: Check Tauri shell
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Clippy Tauri shell
        run: cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml -- -D warnings
