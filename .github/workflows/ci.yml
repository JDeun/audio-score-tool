name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Test
        run: uv run pytest -q

  desktop-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install frontend
        run: npm install
      - name: Typecheck and build frontend
        run: npm run build

  desktop-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install desktop tooling
        working-directory: desktop
        run: npm install
      - name: Generate Tauri icons
        working-directory: desktop
        run: npx tauri icon src-tauri/icons/icon.png
      - uses: dtolnay/rust-toolchain@stable
      - name: Create CI sidecar placeholder
        run: |
          touch desktop/src-tauri/binaries/audio-score-backend-x86_64-unknown-linux-gnu
          chmod +x desktop/src-tauri/binaries/audio-score-backend-x86_64-unknown-linux-gnu
      - name: Check Tauri shell
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
