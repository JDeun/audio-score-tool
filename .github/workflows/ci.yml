name: CI

permissions:
  contents: read

# Fast PR gate: parallel code/contract checks. Full installers and expensive
# dependency audits have separate workflows. Preserve "verify" for #38.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tauri: ${{ steps.filter.outputs.tauri }}
    steps:
      - name: Checkout full history for base comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine whether Rust/Tauri needs recompiling
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            tauri=true
          elif git diff --name-only "$BASE_SHA" HEAD -- \
            desktop/src-tauri desktop/package.json desktop/package-lock.json \
            .github/workflows/ci.yml | grep -q .; then
            tauri=true
          else
            tauri=false
          fi
          echo "tauri=$tauri" >> "$GITHUB_OUTPUT"
          echo "Tauri compile needed: $tauri"

  python:
    name: python
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.10
          enable-cache: true

      - name: Repository forensic hygiene
        run: python scripts/forensic_hygiene.py

      - name: Validate research knowledge wiki
        run: python scripts/check_knowledge_wiki.py

      - name: Audit pinned historical implementation evidence
        run: python scripts/audit_research_history.py

      - name: Audit research claim provenance and review freshness
        run: python scripts/audit_knowledge_evidence.py

      - name: Verify Python lockfile
        run: uv lock --check

      - name: Install Python dependencies
        run: uv sync --frozen --extra dev

      - name: Python lint
        run: uv run --frozen ruff check src tests training scripts

      - name: Music adversarial benchmark gate
        run: |
          uv run --frozen python scripts/run_music_adversarial_benchmark.py \
            --output /tmp/music-adversarial-benchmark.json

      # Every full pytest run already covers the adversarial and concurrency suites.
      # Repeat destructive/stress cases after merging instead of three times per PR.
      - name: Adversarial boundary and recovery stress (main/manual)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Adversarial stress pass ${attempt}/3"
            uv run --frozen pytest -q \
              tests/test_adversarial_boundaries.py \
              tests/test_adversarial_state_recovery.py \
              tests/test_managed_components.py \
              tests/test_managed_component_tamper.py \
              tests/test_runner_adversarial.py \
              tests/test_direct_score_import.py::test_malformed_midi_failure_is_contained_to_job \
              tests/test_youtube.py::test_validate_youtube_url_rejects_credential_and_ssrf_like_inputs
          done

      - name: Concurrency and recovery soak (main/manual)
        if: github.event_name != 'pull_request'
        run: uv run --frozen pytest -q tests/test_concurrency_soak.py

      - name: Locked product Python tests (warnings are errors)
        run: python scripts/run_ci_test_scope.py --scope product

      - name: All research regressions in isolated numerical environment
        run: python scripts/run_ci_test_scope.py --scope research

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend
        working-directory: desktop
        run: npm ci --loglevel=error

      - name: Typecheck and build frontend
        working-directory: desktop
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: desktop
        run: npx --no-install playwright install --with-deps chromium

      - name: Accessibility, workflow and visual-contract E2E
        working-directory: desktop
        run: npm run test:e2e

  tauri:
    name: tauri
    needs: changes
    if: needs.changes.outputs.tauri == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy

      - name: Cache Rust dependencies and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-rust-1.98.1-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.98.1-

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend tools for icon generation
        working-directory: desktop
        run: npm ci --loglevel=error

      - name: Generate Tauri icons
        working-directory: desktop
        run: npx --no-install tauri icon src-tauri/app-icon.svg

      - name: Create CI sidecar placeholder
        run: |
          mkdir -p desktop/src-tauri/binaries
          touch desktop/src-tauri/binaries/audio-score-backend-x86_64-unknown-linux-gnu
          chmod +x desktop/src-tauri/binaries/audio-score-backend-x86_64-unknown-linux-gnu

      - name: Check Tauri shell
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Clippy Tauri shell
        run: cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml -- -D warnings

  # The only required status context on main stays "verify".
  # A failed/skipped upstream job cannot be masked by a green aggregate.
  verify:
    name: verify
    if: ${{ always() }}
    needs: [changes, python, frontend, tauri]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful Python, frontend and Tauri checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          TAURI_REQUIRED: ${{ needs.changes.outputs.tauri }}
          TAURI_RESULT: ${{ needs.tauri.result }}
        shell: bash
        run: |
          echo "changes=$CHANGES_RESULT python=$PYTHON_RESULT frontend=$FRONTEND_RESULT tauri=$TAURI_RESULT required=$TAURI_REQUIRED"
          test "$CHANGES_RESULT" = success
          test "$PYTHON_RESULT" = success
          test "$FRONTEND_RESULT" = success
          if [[ "$TAURI_REQUIRED" == "true" ]]; then
            test "$TAURI_RESULT" = success
          else
            test "$TAURI_REQUIRED" = false
            test "$TAURI_RESULT" = skipped
          fi
