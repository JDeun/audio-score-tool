name: CI

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.10
          enable-cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1

      - name: Generate lockfiles
        run: |
          rm -f uv.lock
          uv lock
          npm install --package-lock-only --ignore-scripts --prefix desktop
          cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml

      - name: Commit lockfiles to same-repository PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock desktop/package-lock.json desktop/src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: lock Python, frontend, and Rust dependencies"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Python lint
        run: uv run ruff check src tests training scripts

      - name: Python tests
        run: uv run pytest -q

      - name: Install frontend
        working-directory: desktop
        run: npm install

      - name: Typecheck and build frontend
        working-directory: desktop
        run: npm run build

      - name: Generate Tauri icons
        working-directory: desktop
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Create CI sidecar placeholder
        run: |
          mkdir -p desktop/src-tauri/binaries
          touch desktop/src-tauri/binaries/audio-score-backend-x86_64-unknown-linux-gnu
          chmod +x desktop/src-tauri/binaries/audio-score-backend-x86_64-unknown-linux-gnu

      - name: Check Tauri shell
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
