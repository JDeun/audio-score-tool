name: CPU No-Reference Pulse Unit Selection

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - research/tempo-beat-unit-20261112
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cpu-unit-selection-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: '0'
  CUDA_VISIBLE_DEVICES: ''
  HF_TOKEN: ''
  HUGGING_FACE_HUB_TOKEN: ''
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'

jobs:
  unit-selection:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Install fixed CPU-only numeric runtime
        run: |
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 mido==1.3.3 pytest==8.4.2 ruff==0.16.6
          python -m pip check
      - name: Validate label-free selection and shared physical grids
        run: |
          python -m ruff check scripts/tempo_unit_selector.py scripts/run_tempo_unit_selector.py tests/test_tempo_unit_selector.py
          python -m compileall -q scripts/tempo_unit_selector.py scripts/run_tempo_unit_selector.py
          python -m pytest -q tests/test_tempo_unit_selector.py tests/test_tempo_unit_probe.py
      - name: Fetch fixed previous predictions using read-only job permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/artifacts/13900383659/zip" > "$RUNNER_TEMP/unit-source.zip"
          printf '%s  %s\n' 'd62e26589018d0690e65104858ff37cd2763e5c9cce22166cd2b854d80fff08d' "$RUNNER_TEMP/unit-source.zip" | sha256sum --check
      - name: Fetch only the checksum-bound original MIDI metadata archive
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --max-time 240 --retry 3 --max-filesize 8000000 \
            https://storage.googleapis.com/magentadata/datasets/groove/groove-v1.0.0-midionly.zip --output "$RUNNER_TEMP/gmd-midi.zip"
          printf '%s  %s\n' '651cbc524ffb891be1a3e46d89dc82a1cecb09a57c748c7b45b844c4841dcc1e' "$RUNNER_TEMP/gmd-midi.zip" | sha256sum --check
      - name: Compare predeclared selectors before accessing evaluation labels
        run: |
          mkdir -p "$RUNNER_TEMP/unit-selection-output"
          python -m scripts.run_tempo_unit_selector --receipt "$RUNNER_TEMP/unit-source.zip" \
            --midi-zip "$RUNNER_TEMP/gmd-midi.zip" --report "$RUNNER_TEMP/unit-selection-output/report.json"
      - name: Upload derived metadata only, no audio MIDI or weights
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tempo-unit-selection-${{ github.run_id }}
          path: ${{ runner.temp }}/unit-selection-output/report.json
          if-no-files-found: warn
          retention-days: 14
