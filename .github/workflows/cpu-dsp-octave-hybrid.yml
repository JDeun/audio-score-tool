name: CPU DSP Octave Evidence Hybrid

on:
  pull_request:
    types: [opened, reopened]
    branches: [research/dsp-pyin-note-baseline-20261111]
    paths:
      - '.github/workflows/cpu-dsp-octave-hybrid.yml'
      - 'scripts/dsp_octave_evidence.py'
      - 'scripts/run_dsp_octave_hybrid.py'
      - 'tests/test_dsp_octave_evidence.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-dsp-octave-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
  CUDA_VISIBLE_DEVICES: ''
  HF_TOKEN: ''
  HUGGING_FACE_HUB_TOKEN: ''
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  NUMBA_NUM_THREADS: '2'

jobs:
  evaluate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    name: CPU / ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        task: [basic_pitch, yourmt3]
    env:
      TASK: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'
      - name: Prepare the fixed CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "HF_HOME=$RUNNER_TEMP/octave-hybrid-hf" >> "$GITHUB_ENV"
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python -m pip install 'numpy==1.26.4' 'scipy==1.13.1' 'mir-eval==0.8.2' \
            'librosa==0.10.2.post1' 'soundfile==0.13.1' 'numba==0.60.0' \
            'resampy==0.4.2' 'mido==1.3.3' 'music21==9.7.1' 'pytest==8.4.2' \
            'ruff==0.12.12' 'huggingface-hub==0.34.4' 'pyyaml==6.0.2' 'typer==0.16.0'
          if [[ "$TASK" == yourmt3 ]]; then
            python -m pip install 'torch==2.7.1' 'torchaudio==2.7.1' 'torchvision==0.22.1' \
              --index-url https://download.pytorch.org/whl/cpu
            printf 'numpy==1.26.4\ntorch==2.7.1\ntorchaudio==2.7.1\ntorchvision==0.22.1\nmir-eval==0.8.2\nlibrosa==0.10.2.post1\nscipy==1.13.1\n' > "$RUNNER_TEMP/constraints.txt"
            python -m pip install -c "$RUNNER_TEMP/constraints.txt" 'mt3-infer[torch]==0.2.0' \
              'transformers==4.44.2' 'mutagen==1.47.0' 'defusedxml==0.7.1'
          else
            python -m pip install 'onnxruntime==1.20.1' 'pretty-midi==0.2.10'
            python -m pip install --no-deps 'basic-pitch==0.4.0'
          fi
      - name: Check pitch-only mutation, ambiguity, anchors and incomplete-score contracts
        run: |
          python -m ruff check scripts/dsp_octave_evidence.py scripts/run_dsp_octave_hybrid.py tests/test_dsp_octave_evidence.py
          python -m pytest -q tests/test_dsp_octave_evidence.py
      - name: Measure known signals and frequency-range effects once
        if: matrix.task == 'basic_pitch'
        run: |
          python -m scripts.run_dsp_octave_hybrid --task signals \
            --work "$RUNNER_TEMP/signal-private" --report "$RUNNER_TEMP/octave-reports/signals.json"
      - name: Fetch the same checksum-bound development corpus
        run: |
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --max-time 600 --retry 3 --max-filesize 60000000 \
            'https://zenodo.org/records/5578807/files/vocadito.zip?download=1' \
            --output "$RUNNER_TEMP/vocadito.zip"
      - name: Generate all proposals before reference access and evaluate forty originals
        run: |
          python -m scripts.run_dsp_octave_hybrid --task "$TASK" \
            --archive "$RUNNER_TEMP/vocadito.zip" --work "$RUNNER_TEMP/private-$TASK" \
            --report "$RUNNER_TEMP/octave-reports/$TASK.json"
      - name: Preserve missing-run status, never invent a musical zero
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP'])/'octave-reports'/(os.environ['TASK']+'.json')
          if not p.exists():
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(json.dumps({'task':os.environ['TASK'],'status':'preparation_failed',
                  'source_revision':os.environ['GITHUB_SHA'],'all_cases_complete':False,
                  'quality_approved':False})+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dsp-octave-${{ matrix.task }}-${{ github.run_id }}
          path: ${{ runner.temp }}/octave-reports/*.json
          if-no-files-found: error
          retention-days: 14
