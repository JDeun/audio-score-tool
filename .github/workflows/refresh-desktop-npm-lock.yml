name: Refresh Desktop NPM Lock

permissions:
  contents: write

on:
  push:
    branches:
      - desktop-polish-updater-v0.8
    paths:
      - desktop/package.json

concurrency:
  group: refresh-desktop-npm-lock
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Refresh package lock
        working-directory: desktop
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit package lock
        run: |
          if git diff --quiet -- desktop/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/package-lock.json
          git commit -m "chore: refresh desktop npm lock"
          git push
