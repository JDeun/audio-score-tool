name: Tier 2 Model Experiments

on:
  pull_request:
    paths:
      - 'benchmarks/tier2/**'
      - 'scripts/run_tier2_matrix.py'
      - 'scripts/validate_tier2_experiment.py'
      - 'src/audio_score_tool/tier2_experiment_record.py'
      - 'src/audio_score_tool/tier2_benchmark.py'
      - 'tests/test_tier2_matrix.py'
      - 'tests/test_tier2_matrix_provenance.py'
      - 'src/audio_score_tool/sheetsage_hybrid.py'
      - 'tests/test_sheetsage_hybrid.py'
      - 'scripts/ensemble_amt_predictions.py'
      - 'tests/test_ensemble_amt_predictions.py'
      - 'scripts/evaluate_tier2_ensemble.py'
      - 'tests/test_tier2_ensemble_evaluation.py'
      - '.github/workflows/tier2-model-experiments.yml'
  workflow_dispatch:
    inputs:
      execute:
        description: "Run real models (requires self-hosted runner with licensed corpus and pinned revisions)"
        type: boolean
        default: false
      device:
        description: "Inference device for real runs"
        type: choice
        options: [cpu, cuda, mps]
        default: cpu
      evaluate_ensemble:
        description: "Compare two AMT predictions and their consensus using private independent MIDI references"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tier2-experiments
  cancel-in-progress: false

jobs:
  matrix-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
          version: 0.12.10
      - name: Install frozen test dependencies
        run: uv sync --frozen --extra dev
      - name: Verify SheetSage2 and MIDI ensemble round-trip contracts
        run: uv run --frozen pytest -q tests/test_sheetsage_hybrid.py tests/test_ensemble_amt_predictions.py tests/test_tier2_matrix.py tests/test_tier2_matrix_provenance.py tests/test_tier2_ensemble_evaluation.py
      - name: Validate ensemble reference CLI entrypoint
        run: uv run --frozen python scripts/evaluate_tier2_ensemble.py --help
      - name: Validate and enumerate full model combination plan
        run: python scripts/run_tier2_matrix.py --dry-run --output-root tier2-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tier2-experiment-plan
          path: tier2-results/summary.json

  execute-models:
    if: inputs.execute == true
    needs: matrix-preflight
    runs-on: [self-hosted, linux, tier2-corpus]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.10
      - name: Verify runner environment
        shell: bash
        run: |
          set -euo pipefail
          test -d "${TIER2_CORPUS_ROOT:?Set TIER2_CORPUS_ROOT on the private runner}"
          test -f "${TIER2_MANIFEST_PATH:?Set TIER2_MANIFEST_PATH on the private runner}"
          uv sync --frozen
          uv run --frozen python -c 'import audio_score_tool'
      - name: Run available combinations sequentially
        shell: bash
        run: |
          uv run --frozen python scripts/run_tier2_matrix.py \
            --manifest "$TIER2_MANIFEST_PATH" \
            --corpus-root "$TIER2_CORPUS_ROOT" \
            --device "${{ inputs.device }}" \
            --output-root tier2-results
      - name: Evaluate AMT consensus against private licensed MIDI references
        if: inputs.evaluate_ensemble == true
        shell: bash
        run: |
          set -euo pipefail
          test -f "${TIER2_MANIFEST_PATH:?Private Tier 2 manifest required}"
          test -d tier2-results/yourmt3
          test -d tier2-results/mr-mt3
          uv run --frozen python scripts/evaluate_tier2_ensemble.py \
            "$TIER2_MANIFEST_PATH" \
            --corpus-root "$TIER2_CORPUS_ROOT" \
            --first-root tier2-results/yourmt3 \
            --second-root tier2-results/mr-mt3 \
            --output-root tier2-results/ensemble
      - name: Preserve reports even after failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tier2-experiment-results
          path: |
            tier2-results/*-report.json
            tier2-results/comparison.json
            tier2-results/summary.json
            tier2-results/ensemble/ensemble-evaluation.json
          if-no-files-found: warn
