name: CPU Same Score Expression

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - '.github/workflows/cpu-same-score-expression.yml'
      - 'scripts/run_same_score_expression.py'
      - 'scripts/same_score_phase.py'
      - 'scripts/same_score_expression_study.py'
      - 'scripts/nasap_same_score_source.py'
      - 'scripts/nasap_same_score_manifest.json'
      - 'tests/test_run_same_score_expression.py'
      - 'tests/test_same_score_phase.py'
      - 'tests/test_same_score_expression_study.py'
      - 'tests/test_nasap_same_score_source.py'
      - 'docs/research/SAME_SCORE_EXPRESSION_PROTOCOL_2026-11-12.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: same-score-expression-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: '0'
  CUDA_VISIBLE_DEVICES: ''
  HF_TOKEN: ''
  HUGGING_FACE_HUB_TOKEN: ''
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  EXPERIMENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  study:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install pinned MIDI parser and contract tools
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            mido==1.3.3 pytest==8.4.2 ruff==0.16.6
      - name: Validate inference, source, evaluation and execution contracts
        run: |
          python -m ruff check scripts/run_same_score_expression.py \
            scripts/same_score_phase.py scripts/nasap_same_score_source.py \
            scripts/same_score_expression_study.py tests/test_run_same_score_expression.py \
            tests/test_same_score_phase.py tests/test_nasap_same_score_source.py \
            tests/test_same_score_expression_study.py
          python -m compileall -q scripts/run_same_score_expression.py \
            scripts/same_score_phase.py scripts/nasap_same_score_source.py \
            scripts/same_score_expression_study.py
          mkdir -p "$RUNNER_TEMP/same-score-expression-tests"
          cp tests/test_run_same_score_expression.py tests/test_same_score_phase.py \
            tests/test_nasap_same_score_source.py tests/test_same_score_expression_study.py \
            "$RUNNER_TEMP/same-score-expression-tests/"
          python -m pytest -q -p no:cacheprovider -c /dev/null "$RUNNER_TEMP/same-score-expression-tests"
      - name: Infer every fixed take before synthetic and same-score evaluation
        run: |
          python -m scripts.run_same_score_expression \
            --work "$RUNNER_TEMP/private-same-score-expression" \
            --output "$RUNNER_TEMP/same-score-expression-report/report.json"
      - name: Preserve a receipt when preparation or contracts block execution
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ['RUNNER_TEMP']) / 'same-score-expression-report/report.json'
          if not output.exists():
              output.parent.mkdir(parents=True, exist_ok=True)
              report = {
                  'schema_version': 1, 'status': 'execution_not_started',
                  'failure_stage': 'workflow_preparation_or_contracts',
                  'reason': 'A required workflow step failed before a study receipt was available.',
                  'expected_scope_case_counts': {'synthetic_exact_onsets': 484, 'real_same_score': 4},
                  'planned_inferences': 488, 'completed_inferences': 0,
                  'completed_preservation_checks': 0, 'planned_ids': [], 'planned_scopes': {},
                  'cases': [], 'evaluation': None, 'summary': None,
                  'evaluation_started': False, 'all_predictions_saved_before_evaluation': False,
                  'evaluation_loading_started': False, 'synthetic_evaluation_loaded': False,
                  'real_evaluation_loaded': False,
                  'source_head': os.environ.get('EXPERIMENT_HEAD'),
                  'source_revision': os.environ.get('GITHUB_SHA'),
                  'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
                  'workflow_run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              }
              output.write_text(json.dumps(report, indent=2, allow_nan=False) + '\n')
          PY
      - name: Upload scoped evaluation metadata only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: same-score-expression-${{ github.run_id }}
          path: ${{ runner.temp }}/same-score-expression-report/report.json
          retention-days: 14
          if-no-files-found: warn
