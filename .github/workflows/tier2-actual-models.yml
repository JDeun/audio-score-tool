name: Tier 2 Actual Model Smoke Tests

on:
  push:
    branches: [research/tier2-model-experiments]
    paths:
      - '.github/workflows/tier2-actual-models.yml'
      - 'scripts/run_tier2_model_smoke.py'
      - 'scripts/smoke_real_mt3_managed_checkpoint.py'
      - 'scripts/generate_tier2_smoke_audio.py'
      - 'src/audio_score_tool/sheetsage_hybrid.py'
      - 'tests/test_sheetsage_hybrid.py'
  pull_request:
    paths:
      - '.github/workflows/tier2-actual-models.yml'
      - 'scripts/run_tier2_model_smoke.py'
      - 'scripts/smoke_real_mt3_managed_checkpoint.py'
      - 'scripts/run_tier2_hybrid_smoke.py'
      - 'scripts/sheetsage2_infer_adapter.py'
      - 'scripts/generate_tier2_smoke_audio.py'
      - 'src/audio_score_tool/transcription_engine.py'
      - 'src/audio_score_tool/muscriptor_cache.py'
      - 'tests/test_muscriptor_offline_cached_midi.py'
      - 'src/audio_score_tool/sheetsage_hybrid.py'
      - 'tests/test_tier2_actual_model_smoke.py'
      - 'tests/test_tier2_hybrid_smoke.py'
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'Permitted YouTube video URL (max 300 seconds)'
        required: false
        type: string
      muscriptor_source:
        description: 'Opt-in gated MuScriptor QA source; pinned author WAV/MIDI requires no YouTube URL'
        required: false
        type: choice
        default: none
        options:
          - none
          - cocochorales-author-train
          - authorized-youtube

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}

concurrency:
  group: tier2-actual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  amt:
    name: ${{ matrix.model }} CPU transcription
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        model: [yourmt3, mr_mt3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Install inference runtime
        env:
          MT3_MODEL: ${{ matrix.model }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'mt3-infer[torch]==0.2.0' 'music21>=9.7,<11'
          python -m pip install --no-deps -e .
          python -c 'import audio_score_tool, scripts.run_tier2_model_smoke; print("AudioScoreTool installed for real inference")'
          mt3-infer transcribe --help
          # The two upstream adapters need incompatible Transformers T5 APIs.
          if [ "${{ matrix.model }}" = "mr_mt3" ]; then
            python -m pip install 'transformers==4.57.6'
          else
            python -m pip install 'transformers==4.44.2' 'tokenizers>=0.19,<0.20'
          fi
          python - <<'PY'
          import inspect
          import os
          import transformers
          from transformers.models.t5.modeling_t5 import T5Block
          model = os.environ["MT3_MODEL"]
          expected_version = "4.57.6" if model == "mr_mt3" else "4.44.2"
          expected_argument = "past_key_values" if model == "mr_mt3" else "past_key_value"
          assert transformers.__version__ == expected_version, transformers.__version__
          assert expected_argument in inspect.signature(T5Block.forward).parameters
          PY
      - name: Install YouTube audio downloader
        if: inputs.youtube_url != ''
        run: python -m pip install yt-dlp
      - name: Download permitted real-world audio
        if: inputs.youtube_url != ''
        env:
          BENCHMARK_URL: ${{ inputs.youtube_url }}
        run: python scripts/download_youtube_benchmark.py "$BENCHMARK_URL" out/chords.wav
      - name: Synthesize original AMT test audio
        if: inputs.youtube_url == ''
        run: python scripts/generate_tier2_smoke_audio.py out/chords.wav
      - name: Run real AMT inference
        env:
          # The upstream downloader stores the *actual* model files here;
          # never rely on an implicit user HOME cache in the next step.
          MT3_CHECKPOINT_DIR: ${{ runner.temp }}/ast-reviewed-mt3-checkpoints
        run: |
          python scripts/run_tier2_model_smoke.py out/chords.wav out/${{ matrix.model }} --model ${{ matrix.model }}
      - name: Prove real checkpoint through app-managed ZIP and offline packaged inference
        env:
          MT3_CHECKPOINT_DIR: ${{ runner.temp }}/ast-reviewed-mt3-checkpoints
        run: |
          # This test uses the existing Python interpreter ONLY in CI.
          # It is not a redistributable frozen runtime or clean-machine proof.
          # No third-party weights/CLI/archive leave the runner; only a
          # SHA-256/CPU-inference pending JSON receipt is uploaded below.
          python scripts/smoke_real_mt3_managed_checkpoint.py \
            --model ${{ matrix.model }} \
            --audio out/chords.wav \
            --checkpoint-dir "$MT3_CHECKPOINT_DIR" \
            --output out/${{ matrix.model }}/managed-real-checkpoint.pending.json
      - name: Upload synthetic-only model output to the hybrid job
        if: ${{ always() && inputs.youtube_url == '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amt-${{ matrix.model }}-${{ github.run_id }}
          path: |
            out/**/*.mid
            out/**/*.musicxml
            out/**/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Keep real-source inference evidence metadata-only
        if: ${{ always() && inputs.youtube_url != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amt-real-metadata-${{ matrix.model }}-${{ github.run_id }}
          path: |
            out/${{ matrix.model }}/smoke-result.json
            out/${{ matrix.model }}/managed-real-checkpoint.pending.json
          if-no-files-found: warn
          retention-days: 7

  hybrid:
    name: ${{ matrix.model }} + SheetSage2 fusion
    # Preserve evidence for a successful model even if another matrix entry fails.
    # The detached AMT -> hybrid transfer contains model-generated score bytes.
    # Only run that path on our synthesized original CI waveform; never publish
    # model predictions derived from an externally provided recording.
    if: ${{ always() && needs.amt.result != 'cancelled' && inputs.youtube_url == '' }}
    needs: amt
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        model: [yourmt3, mr_mt3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Download base model output
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: amt-${{ matrix.model }}-${{ github.run_id }}
          path: out
      - name: Install SheetSage2 and MusicXML dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install 'sheetsage-infer @ git+https://github.com/openmirlab/sheetsage-infer.git@8f31ada34494ac24ee02f0d7e96edcb33a3e997b' music21
          python -m pip install --no-deps -e .
          python -c 'import audio_score_tool, scripts.run_tier2_hybrid_smoke; from sheetsage import SheetSageTranscriber; print("Hybrid providers importable")'
      - name: Recreate original AMT test audio for hybrid comparison
        if: inputs.youtube_url == ''
        run: python scripts/generate_tier2_smoke_audio.py out/chords.wav
      - name: Install authorized YouTube downloader
        if: inputs.youtube_url != ''
        run: python -m pip install yt-dlp
      - name: Download authorized reference audio for hybrid comparison
        if: inputs.youtube_url != ''
        env:
          BENCHMARK_URL: ${{ inputs.youtube_url }}
        run: python scripts/download_youtube_benchmark.py "$BENCHMARK_URL" out/chords.wav
      - name: Validate identical audio and actual AMT artifacts before fusion
        run: |
          python -m scripts.run_tier2_hybrid_smoke out/chords.wav out/${{ matrix.model }} \
            --model ${{ matrix.model }} --phase verify-base
      - name: Run actual SheetSage2 inference and verified score fusion
        env:
          SHEETSAGE_RUNTIME_REVISION: 8f31ada34494ac24ee02f0d7e96edcb33a3e997b
        run: |
          python scripts/sheetsage2_infer_adapter.py out/chords.wav out/sheetsage2.json --device cpu
          python -m scripts.run_tier2_hybrid_smoke out/chords.wav out/${{ matrix.model }} \
            --model ${{ matrix.model }} --phase merge \
            --events out/sheetsage2.json \
            --merged out/${{ matrix.model }}+sheetsage2.musicxml
      - name: Upload fusion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hybrid-${{ matrix.model }}-${{ github.run_id }}
          path: |
            out/**/*.mid
            out/**/*.musicxml
            out/*.musicxml
            out/**/*.json
          if-no-files-found: warn
          retention-days: 7

muscriptor:
    name: MuScriptor small CPU transcription (credential-gated, research-only)
    # The official CocoChorales author sample is an existing, provenance-pinned
    # WAV + independent MIDI pair (#154). This is an explicit MANUAL opt-in,
    # not a public checkpoint download or held-out quality approval. The other
    # supported source is an operator-reviewed YouTube URL, never a default.
    if: ${{ github.event_name == 'workflow_dispatch' && vars.ENABLE_MUSCRIPTOR == 'true' && ((inputs.muscriptor_source == 'cocochorales-author-train' && inputs.youtube_url == '') || (inputs.muscriptor_source == 'authorized-youtube' && inputs.youtube_url != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Isolate the Hugging Face cache in runner temporary storage
        shell: bash
        run: |
          set -euo pipefail
          echo "HF_HOME=$RUNNER_TEMP/ast-muscriptor-hf" >> "$GITHUB_ENV"
      - name: Install pinned MuScriptor and AudioScoreTool notation runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check \
            'muscriptor @ git+https://github.com/muscriptor/muscriptor.git@8a1ef88672cc23c26619adaff37ec48d82c0b906' \
            'defusedxml==0.7.1' 'yt-dlp'
          python -m pip install --disable-pip-version-check -e .
      - name: Explicitly fetch approved private weights into the app-managed cache
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          from audio_score_tool.muscriptor_cache import cached_muscriptor_checkpoint, hub_root
          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("Blocked: HF_TOKEN and license acceptance required for MuScriptor")
          snapshot_download(
              repo_id="MuScriptor/muscriptor-small",
              token=token,
              cache_dir=str(hub_root()),
          )
          if cached_muscriptor_checkpoint("small") is None:
              raise SystemExit("Blocked: incomplete MuScriptor small checkpoint/config")
          print("Approved private small checkpoint and adjacent config available locally")
          PY
      - name: Verify pinned CocoChorales author WAV and independent reference MIDI
        if: inputs.muscriptor_source == 'cocochorales-author-train'
        shell: bash
        run: |
          set -euo pipefail
          track=string_track001010
          archive="$RUNNER_TEMP/$track.zip"
          corpus="$RUNNER_TEMP/muscriptor-private-source-$track"
          evidence="$RUNNER_TEMP/muscriptor-private-evidence-$track"
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 30 --max-time 600 --retry 3 --retry-delay 3 \
            --output "$archive" \
            "https://raw.githubusercontent.com/lukewys/lukewys.github.io/7a0b15e7be365a6b062027c38ce0f8d57ed1d98a/cocochorales/assets/sample_examples/pieces/$track.zip"
          python -m scripts.prepare_cocochorales_official_sample \
            --archive "$archive" --track-id "$track" \
            --corpus-root "$corpus" --metadata-root "$evidence"
          echo "AST_MUSCRIPTOR_AUDIO=$corpus/$track/mix.wav" >> "$GITHUB_ENV"
          echo "AST_MUSCRIPTOR_CORPUS_ROOT=$corpus" >> "$GITHUB_ENV"
          echo "AST_MUSCRIPTOR_EVIDENCE_ROOT=$evidence" >> "$GITHUB_ENV"
      - name: Download separately authorized YouTube audio for research only
        if: inputs.muscriptor_source == 'authorized-youtube'
        shell: bash
        env:
          BENCHMARK_URL: ${{ inputs.youtube_url }}
        run: |
          set -euo pipefail
          python scripts/download_youtube_benchmark.py "$BENCHMARK_URL" "$RUNNER_TEMP/muscriptor-private-youtube.wav"
          echo "AST_MUSCRIPTOR_AUDIO=$RUNNER_TEMP/muscriptor-private-youtube.wav" >> "$GITHUB_ENV"
      - name: Run actual product engine and independent reference scorer when available
        shell: bash
        env:
          HF_TOKEN: ''
          MUSCRIPTOR_SOURCE: ${{ inputs.muscriptor_source }}
        run: |
          set -euo pipefail
          if [[ "$MUSCRIPTOR_SOURCE" == 'cocochorales-author-train' ]]; then
            python -m scripts.run_muscriptor_source_qa \
              --source-kind cocochorales-author-train \
              --audio "$AST_MUSCRIPTOR_AUDIO" \
              --corpus-root "$AST_MUSCRIPTOR_CORPUS_ROOT" \
              --evidence-root "$AST_MUSCRIPTOR_EVIDENCE_ROOT" \
              --predictions-root "$RUNNER_TEMP/muscriptor-private-predictions" \
              --output out/muscriptor/verification.pending.json
          else
            python -m scripts.run_muscriptor_source_qa \
              --source-kind authorized-youtube \
              --audio "$AST_MUSCRIPTOR_AUDIO" \
              --predictions-root "$RUNNER_TEMP/muscriptor-private-predictions" \
              --output out/muscriptor/verification.pending.json
          fi
      - name: Upload metadata-only MuScriptor research evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: muscriptor-research-${{ github.run_id }}
          path: out/muscriptor/verification.pending.json
          if-no-files-found: warn
          retention-days: 7

