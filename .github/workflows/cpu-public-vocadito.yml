name: CPU Public Vocadito Candidates

on:
  pull_request:
    paths:
      - '.github/workflows/cpu-public-vocadito.yml'
      - 'scripts/run_cpu_vocadito_candidates.py'
      - 'scripts/summarize_cpu_vocadito.py'
      - 'tests/test_cpu_vocadito_candidates.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-public-vocadito-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
  CUDA_VISIBLE_DEVICES: ''
  HF_TOKEN: ''
  HUGGING_FACE_HUB_TOKEN: ''
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  NUMBA_NUM_THREADS: '2'

jobs:
  evaluate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    name: CPU / ${{ matrix.candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        candidate: [basic_pitch, yin, pyin, torchcrepe_tiny, torchcrepe_full, mr_mt3, yourmt3]
    env:
      CANDIDATE: ${{ matrix.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Isolate public model cache in runner temporary storage
        run: echo "HF_HOME=$RUNNER_TEMP/ast-public-hf" >> "$GITHUB_ENV"
      - name: Install CPU research runtime (no GPU or model credentials)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python -m pip install 'numpy==1.26.4' 'scipy==1.13.1' 'mir-eval==0.8.2' \
            'librosa==0.10.2.post1' 'soundfile==0.13.1' 'resampy==0.4.2' \
            'numba==0.60.0' 'mido==1.3.3' 'music21==9.7.1' 'pytest==8.4.2' \
            'huggingface-hub==0.34.4' 'pyyaml==6.0.2' 'typer==0.16.0'
          python -m pip install --no-deps -e .
          if [[ "$CANDIDATE" == mr_mt3 || "$CANDIDATE" == yourmt3 || "$CANDIDATE" == torchcrepe_* ]]; then
            python -m pip install 'torch==2.7.1' 'torchaudio==2.7.1' 'torchvision==0.22.1' \
              --index-url https://download.pytorch.org/whl/cpu
          fi
          case "$CANDIDATE" in
            mr_mt3|yourmt3)
              printf 'numpy==1.26.4\ntorch==2.7.1\ntorchaudio==2.7.1\ntorchvision==0.22.1\nmir-eval==0.8.2\nlibrosa==0.10.2.post1\nscipy==1.13.1\n' > "$RUNNER_TEMP/cpu-constraints.txt"
              if [[ "$CANDIDATE" == mr_mt3 ]]; then TF=4.57.6; else TF=4.44.2; fi
              python -m pip install -c "$RUNNER_TEMP/cpu-constraints.txt" 'mt3-infer[torch]==0.2.0' "transformers==$TF"
              ;;
            basic_pitch)
              python -m pip install 'onnxruntime==1.20.1' 'pretty-midi==0.2.10'
              python -m pip install --no-deps 'basic-pitch==0.4.0'
              ;;
            torchcrepe_*) python -m pip install --no-deps 'torchcrepe==0.0.24' ;;
          esac
      - name: Test evaluator with synthetic cases before real inference
        run: python -m pytest -q tests/test_cpu_vocadito_candidates.py
      - name: Fetch original forty-recording corpus without credentials
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --max-time 600 --retry 3 --max-filesize 60000000 \
            'https://zenodo.org/records/5578807/files/vocadito.zip?download=1' \
            --output "$RUNNER_TEMP/vocadito.zip"
      - name: Evaluate exact original corpus and independent references on CPU
        run: |
          python -m scripts.run_cpu_vocadito_candidates \
            --candidate "$CANDIDATE" --archive "$RUNNER_TEMP/vocadito.zip" \
            --work "$RUNNER_TEMP/private-$CANDIDATE" \
            --report "$RUNNER_TEMP/reports/$CANDIDATE.json"
      - name: Publish only metadata, never recordings, notes, MIDI or weights
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpu-vocadito-${{ matrix.candidate }}-${{ github.run_id }}
          path: ${{ runner.temp }}/reports/${{ matrix.candidate }}.json
          if-no-files-found: warn
          retention-days: 14

  summarize:
    if: always() && needs.evaluate.result != 'skipped' && needs.evaluate.result != 'cancelled'
    needs: evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: cpu-vocadito-*-${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/reports
      - run: python -m pip install 'numpy==1.26.4'
      - name: Reject incomplete or mismatched comparisons; separate note and F0 metrics
        run: |
          python -m scripts.summarize_cpu_vocadito --reports "$RUNNER_TEMP/reports" \
            --output "$RUNNER_TEMP/summary/cpu-vocadito-summary.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cpu-vocadito-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/summary/cpu-vocadito-summary.json
          if-no-files-found: warn
          retention-days: 14
