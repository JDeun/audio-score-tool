name: Refresh self-contained runtime lock

on:
  push:
    branches:
      - refactor/self-contained-runtime-v0.8

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/self-contained-runtime-v0.8
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.10
      - name: Refresh uv.lock
        run: uv lock
      - name: Commit refreshed lock
        run: |
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'chore: refresh uv lock for embedded notation renderer'
          git push
