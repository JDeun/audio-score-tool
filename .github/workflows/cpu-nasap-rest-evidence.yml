name: CPU nASAP Silence Evidence Development
on:
  pull_request:
    types: [opened, reopened]
    branches: ['integrate/research-evidence-20261112']
    paths: ['scripts/nasap_rest_evidence.py', 'tests/test_nasap_rest_evidence.py', '.github/workflows/cpu-nasap-rest-evidence.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nasap-rest-evidence-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: '0'
  CUDA_VISIBLE_DEVICES: ''
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
jobs:
  rest-evidence:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'
      - name: Install only CPU regression runtime
        run: python -m pip install mido==1.3.3 pytest==8.4.2 ruff==0.16.6
      - name: Verify new code and inherited contracts
        run: |
          python -m ruff check scripts/nasap_rest_evidence.py tests/test_nasap_rest_evidence.py
          python -m compileall -q scripts/nasap_rest_evidence.py
          python -m pytest -q tests/test_nasap_rest_evidence.py tests/test_nasap_joint_rhythm.py tests/test_nasap_joint_holdout.py tests/test_nasap_keyoff_paired.py tests/test_nasap_duration_probe.py tests/test_nasap_duration_source.py
      - name: Read pinned DEVELOPMENT artifact only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/artifacts/13911212291/zip" > "$RUNNER_TEMP/development.zip"
          printf '%s  %s\n' '224dd43e067bdfbb87d1e0ef9c1af48baaf5ccd385c259c388ab69f543fd55e4' "$RUNNER_TEMP/development.zip" | sha256sum --check
      - name: Evaluate fixed controls and new evidence objectives
        run: |
          mkdir -p "$RUNNER_TEMP/rest-evidence"
          python -m scripts.nasap_rest_evidence --development "$RUNNER_TEMP/development.zip" --output "$RUNNER_TEMP/rest-evidence/report.json"
      - name: Include our code, never source music
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/rest-evidence/reproduction/scripts" "$RUNNER_TEMP/rest-evidence/reproduction/tests"
          cp scripts/nasap_rest_evidence.py "$RUNNER_TEMP/rest-evidence/reproduction/scripts/"
          cp tests/test_nasap_rest_evidence.py "$RUNNER_TEMP/rest-evidence/reproduction/tests/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nasap-rest-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/rest-evidence/
          if-no-files-found: error
          retention-days: 14
