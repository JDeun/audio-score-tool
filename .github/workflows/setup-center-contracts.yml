name: Setup Center Contracts

on:
  pull_request:
    paths:
      - '.github/workflows/setup-center-contracts.yml'
      - 'src/audio_score_tool/setup_center_api.py'
      - 'src/audio_score_tool/managed_components.py'
      - 'src/audio_score_tool/managed_component_catalog.py'
      - 'desktop/src/SetupCenter.tsx'
      - 'desktop/src/setup-center.css'
      - 'desktop/e2e/setup-center-managed.spec.ts'
      - 'tests/test_managed_components.py'
      - 'tests/test_setup_center_managed_runtime.py'
      - 'desktop/src/ModelManager.tsx'
      - 'tests/test_model_manager_wiring.py'
      - 'tests/test_desktop_api_wiring.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-center-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: setup-center-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Python test dependencies
        run: uv sync --frozen --extra dev
      - name: Verify managed component integrity, install, removal, recovery and API
        run: uv run --frozen pytest -q tests/test_managed_components.py tests/test_setup_center_managed_runtime.py tests/test_model_manager_wiring.py tests/test_desktop_api_wiring.py
      - name: Install frontend
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Build React desktop frontend
        working-directory: desktop
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: desktop
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify Setup Center installation/removal/recovery UX
        working-directory: desktop
        run: npm run test:e2e -- setup-center-managed.spec.ts
