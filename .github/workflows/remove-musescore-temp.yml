name: Remove MuseScore references (temporary)

permissions:
  contents: write

on:
  push:
    branches: ["fix/remove-musescore-dependency"]
    paths: [".github/workflows/remove-musescore-temp.yml"]

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/remove-musescore-dependency
      - name: Apply exact cleanup
        shell: python
        run: |
          from pathlib import Path

          api = Path("src/audio_score_tool/api.py")
          text = api.read_text(encoding="utf-8")
          old = '''    yt_dlp_cmd: str | None = None\n    musescore_cmd: str | None = None\n'''
          assert old in text
          text = text.replace(old, '''    yt_dlp_cmd: str | None = None\n''', 1)
          old = '''        yt_dlp_cmd=saved.get("yt_dlp_cmd") or defaults.yt_dlp_cmd,\n        musescore_cmd=saved.get("musescore_cmd") or defaults.musescore_cmd,\n        muscriptor_model=muscriptor_model,\n'''
          assert old in text
          text = text.replace(old, '''        yt_dlp_cmd=saved.get("yt_dlp_cmd") or defaults.yt_dlp_cmd,\n        muscriptor_model=muscriptor_model,\n''', 1)
          api.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          start = text.index("## MuseScore는 필수인가?")
          end = text.index("\n---\n\n## 주요 기능", start)
          replacement = '''## MuseScore 비의존 정책\n\nAudioScoreTool은 **MuseScore 4를 설치하지 않아도 전체 핵심 워크플로가 동작하도록 설계합니다.** MuseScore CLI를 runtime fallback으로 호출하지 않습니다.\n\n```text\n미리보기            OSMD\nMIDI ↔ MusicXML     music21 (BSD)\n파트 분리           AudioScoreTool 자체 MusicXML 처리\nMusicXML → PDF       LilyPond + musicxml2ly\nOMR                 Audiveris\n```\n\n- MusicXML 미리보기/편집 및 export는 MuseScore와 무관합니다.\n- MIDI 변환은 `music21`이 담당합니다.\n- PDF/파트 PDF가 필요할 때만 LilyPond와 `musicxml2ly`가 필요합니다.\n- PDF renderer가 없어도 채보·편집·MusicXML/MIDI 작업은 계속 사용할 수 있습니다.\n\n`musicxml2ly`가 MusicXML의 모든 표기 기능을 완벽하게 보존하는 것은 아니므로 실제 타깃 악보 Golden Set에서 PDF fidelity는 별도로 검증합니다.\n'''
          text = text[:start] + replacement + text[end:]

          old = '''### 6. MuseScore — 선택 사항\n\n필요할 때만 fallback으로 지정합니다.\n\n```bash\nexport AST_MUSESCORE_CMD=/path/to/musescore\n```\n\n### 7. 데스크탑 앱\n'''
          assert old in text
          text = text.replace(old, '''### 6. 데스크탑 앱\n''', 1)
          text = text.replace('- MuseScore: GPL → 선택적 외부 fallback\n', '')
          readme.write_text(text, encoding="utf-8")
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audio_score_tool/api.py README.md
          git diff --cached --quiet && exit 0
          git commit -m "refactor: remove remaining MuseScore runtime references"
          git push origin HEAD:fix/remove-musescore-dependency
