name: CPU Tempo Beat Model File-Held-Out Comparison

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - research/tempo-consensus-20261112
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-tempo-beat-model-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: '0'
  CUDA_VISIBLE_DEVICES: ''
  HF_TOKEN: ''
  HUGGING_FACE_HUB_TOKEN: ''
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'

jobs:
  paired-tempo:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'
      - name: Install explicit CPU-only pinned numeric runtime
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.7.1+cpu torchaudio==2.7.1+cpu
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 mido==1.3.3 einops==0.8.1 rotary-embedding-torch==0.8.6 soxr==0.5.0.post1 pytest==8.4.2 ruff==0.16.6
          git init "$RUNNER_TEMP/beat-this-source"
          git -C "$RUNNER_TEMP/beat-this-source" remote add origin https://github.com/CPJKU/beat_this.git
          git -C "$RUNNER_TEMP/beat-this-source" fetch --depth=1 origin b95c8ab0c58c2d9fcfd40508ae8dffbc05ac4f5c
          git -C "$RUNNER_TEMP/beat-this-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/beat-this-source" rev-parse HEAD)" = b95c8ab0c58c2d9fcfd40508ae8dffbc05ac4f5c
          python -m pip install --no-deps "$RUNNER_TEMP/beat-this-source"
          python -m pip check
      - name: Validate fold admission, safe model selection and BPM-only scoring
        run: |
          python -m ruff check scripts/tempo_beat_model_probe.py scripts/run_tempo_beat_model_probe.py tests/test_tempo_beat_model_probe.py
          python -m compileall -q scripts/tempo_beat_model_probe.py scripts/run_tempo_beat_model_probe.py
          python -m pytest -q tests/test_tempo_beat_model_probe.py tests/test_tempo_consensus_probe.py
      - name: Get checksum-bound publisher metadata
        run: |
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --max-time 240 --retry 3 --max-filesize 8000000 \
            https://storage.googleapis.com/magentadata/datasets/groove/groove-v1.0.0-midionly.zip --output "$RUNNER_TEMP/gmd-midi.zip"
          printf '%s  %s\n' '651cbc524ffb891be1a3e46d89dc82a1cecb09a57c748c7b45b844c4841dcc1e' "$RUNNER_TEMP/gmd-midi.zip" | sha256sum --check
      - name: Compare identical WAV excerpts using verified validation-fold checkpoints
        run: |
          mkdir -p "$RUNNER_TEMP/beat-model-report"
          python -m scripts.run_tempo_beat_model_probe --archive "$RUNNER_TEMP/gmd-midi.zip" \
            --work "$RUNNER_TEMP/beat-model-private" --upstream-source "$RUNNER_TEMP/beat-this-source" \
            --report "$RUNNER_TEMP/beat-model-report/report.json"
      - name: Upload receipt only, no media or model weights
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tempo-beat-model-${{ github.run_id }}
          path: ${{ runner.temp }}/beat-model-report/report.json
          if-no-files-found: warn
          retention-days: 14
