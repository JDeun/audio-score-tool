name: CPU nASAP Joint Voice Rest and Measure Decoding

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - research/nasap-keyoff-paired-20261112
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cpu-nasap-joint-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: '0'
  CUDA_VISIBLE_DEVICES: ''
  HF_TOKEN: ''
  HUGGING_FACE_HUB_TOKEN: ''
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'

jobs:
  joint-rhythm:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Install pinned CPU-only numeric-free runtime and checks
        run: |
          python -m pip install --disable-pip-version-check mido==1.3.3 pytest==8.4.2 ruff==0.16.6
          python -m pip check
      - name: Check Python names, compile, and verify parser and exact search contracts
        run: |
          python -m ruff check --select F scripts/nasap_joint_rhythm.py tests/test_nasap_joint_rhythm.py
          python -m compileall -q scripts/nasap_joint_rhythm.py
          python -m pytest -q tests/test_nasap_joint_rhythm.py tests/test_nasap_keyoff_paired.py tests/test_nasap_duration_probe.py tests/test_nasap_duration_source.py
      - name: Read immutable same-repository prior comparison with read-only job permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/artifacts/13910660014/zip" > "$RUNNER_TEMP/nasap-joint-previous.zip"
          printf '%s  %s\n' 'a9fd6bb76b56ac0e7dc609e3dd9562326265571820d59cbab2edcf5833f99760' "$RUNNER_TEMP/nasap-joint-previous.zip" | sha256sum --check
      - name: Compare fixed independent and joint decoders with explicit XML rest references
        run: |
          mkdir -p "$RUNNER_TEMP/nasap-joint"
          python -m scripts.nasap_joint_rhythm --previous "$RUNNER_TEMP/nasap-joint-previous.zip" --output "$RUNNER_TEMP/nasap-joint/report.json"
      - name: Include our source and offline checks, never original musical data
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/nasap-joint/reproduction/scripts" "$RUNNER_TEMP/nasap-joint/reproduction/tests"
          cp scripts/nasap_joint_rhythm.py scripts/nasap_keyoff_paired.py scripts/nasap_duration_probe.py scripts/audit_nasap_duration_source.py "$RUNNER_TEMP/nasap-joint/reproduction/scripts/"
          cp tests/test_nasap_joint_rhythm.py tests/test_nasap_keyoff_paired.py tests/test_nasap_duration_probe.py tests/test_nasap_duration_source.py "$RUNNER_TEMP/nasap-joint/reproduction/tests/"
      - name: Upload metadata and our code only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nasap-joint-rhythm-${{ github.run_id }}
          path: ${{ runner.temp }}/nasap-joint/
          if-no-files-found: warn
          retention-days: 14
