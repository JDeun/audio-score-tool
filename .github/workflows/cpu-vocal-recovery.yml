name: CPU Vocal Recovery Ablation

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - '.github/workflows/cpu-vocal-recovery.yml'
      - 'scripts/run_vocal_recovery.py'
      - 'scripts/vocal_recovery.py'
      - 'tests/test_vocal_recovery.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-vocal-recovery-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
  CUDA_VISIBLE_DEVICES: ''
  HF_TOKEN: ''
  HUGGING_FACE_HUB_TOKEN: ''
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  NUMBA_NUM_THREADS: '2'

jobs:
  evaluate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    name: CPU / ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        task: [basic_pitch_decode, yourmt3_recovery]
    env:
      TASK: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Isolate model cache and install pinned CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "HF_HOME=$RUNNER_TEMP/ast-vocal-recovery-hf" >> "$GITHUB_ENV"
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python -m pip install 'numpy==1.26.4' 'scipy==1.13.1' 'mir-eval==0.8.2' \
            'librosa==0.10.2.post1' 'soundfile==0.13.1' 'resampy==0.4.2' \
            'numba==0.60.0' 'mido==1.3.3' 'music21==9.7.1' 'pytest==8.4.2' \
            'huggingface-hub==0.34.4' 'pyyaml==6.0.2' 'typer==0.16.0'
          python -m pip install --no-deps -e .
          if [[ "$TASK" == yourmt3_recovery ]]; then
            python -m pip install 'torch==2.7.1' 'torchaudio==2.7.1' 'torchvision==0.22.1' \
              --index-url https://download.pytorch.org/whl/cpu
            printf 'numpy==1.26.4\ntorch==2.7.1\ntorchaudio==2.7.1\ntorchvision==0.22.1\nmir-eval==0.8.2\nlibrosa==0.10.2.post1\nscipy==1.13.1\n' > "$RUNNER_TEMP/cpu-constraints.txt"
            python -m pip install -c "$RUNNER_TEMP/cpu-constraints.txt" 'mt3-infer[torch]==0.2.0' \
              'transformers==4.44.2' 'mutagen==1.47.0' 'defusedxml==0.7.1'
            python -m pip install --no-deps 'torchcrepe==0.0.24'
            python -c 'from scripts.run_cocochorales_stem_ablation import infer_raw_midi; assert callable(infer_raw_midi)'
          else
            python -m pip install 'onnxruntime==1.20.1' 'pretty-midi==0.2.10'
            python -m pip install --no-deps 'basic-pitch==0.4.0'
          fi
      - name: Test unchanged primary scorer and recovery safety
        run: python -m pytest -q tests/test_vocal_recovery.py tests/test_cpu_vocadito_candidates.py
      - name: Fetch the pinned public forty-recording corpus
        run: |
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --max-time 600 --retry 3 --max-filesize 60000000 \
            'https://zenodo.org/records/5578807/files/vocadito.zip?download=1' \
            --output "$RUNNER_TEMP/vocadito.zip"
      - name: Infer once per recording and compare every predeclared arm
        run: |
          python -m scripts.run_vocal_recovery --task "$TASK" \
            --archive "$RUNNER_TEMP/vocadito.zip" --work "$RUNNER_TEMP/private-$TASK" \
            --output "$RUNNER_TEMP/recovery-reports/$TASK.json"
      - name: Upload only metadata; exclude media, predictions, logs and weights
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vocal-recovery-${{ matrix.task }}-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-reports/${{ matrix.task }}.json
          if-no-files-found: warn
          retention-days: 14
