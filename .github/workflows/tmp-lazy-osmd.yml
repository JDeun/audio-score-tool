name: Temporary lazy OSMD patch

on:
  push:
    branches:
      - hardening/v1-adversarial-ui-final

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/v1-adversarial-ui-final
      - name: Convert OSMD preview to lazy import
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("desktop/src/SongWorkspace.tsx")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'import { OpenSheetMusicDisplay } from "opensheetmusicdisplay";\n',
              '',
              1,
          )
          old = '''  useEffect(() => {\n    if (!xml || !scoreRef.current) return;\n    let cancelled = false;\n    const target = scoreRef.current;\n    target.innerHTML = "";\n    const osmd = new OpenSheetMusicDisplay(target, {\n      autoResize: true,\n      drawTitle: true,\n      drawPartNames: true,\n      backend: "svg",\n    });\n    osmd.Zoom = previewZoom / 100;\n    void osmd.load(xml).then(() => {\n      if (!cancelled) osmd.render();\n    }).catch((error) => {\n      if (!cancelled) setMessage(`악보 미리보기 오류: ${String(error)}`);\n    });\n    return () => { cancelled = true; };\n  }, [xml, previewZoom]);'''
          new = '''  useEffect(() => {\n    if (!xml || !scoreRef.current) return;\n    let cancelled = false;\n    const target = scoreRef.current;\n    target.innerHTML = "";\n\n    void (async () => {\n      try {\n        const { OpenSheetMusicDisplay } = await import("opensheetmusicdisplay");\n        if (cancelled) return;\n        const osmd = new OpenSheetMusicDisplay(target, {\n          autoResize: true,\n          drawTitle: true,\n          drawPartNames: true,\n          backend: "svg",\n        });\n        osmd.Zoom = previewZoom / 100;\n        await osmd.load(xml);\n        if (!cancelled) osmd.render();\n      } catch (error) {\n        if (!cancelled) setMessage(`악보 미리보기 오류: ${String(error)}`);\n      }\n    })();\n\n    return () => { cancelled = true; };\n  }, [xml, previewZoom]);'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'await import("opensheetmusicdisplay")' not in text:
              raise SystemExit("Expected OSMD effect was not found")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src/SongWorkspace.tsx
          git commit -m "perf: lazy-load score engraving renderer"
          git push origin HEAD:hardening/v1-adversarial-ui-final
