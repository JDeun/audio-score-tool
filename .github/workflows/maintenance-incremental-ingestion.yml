name: Maintenance Incremental Ingestion

permissions:
  contents: write

on:
  push:
    branches: ["stabilize-runtime-release-v0.8"]
    paths:
      - "scripts/apply_incremental_ingestion_refactor.py"
      - ".github/workflows/maintenance-incremental-ingestion.yml"

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: stabilize-runtime-release-v0.8
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.10
      - name: Apply refactor
        run: python scripts/apply_incremental_ingestion_refactor.py
      - name: Install test dependencies
        run: uv sync --frozen --extra desktop
      - name: Run focused tests
        run: uv run pytest tests/test_job_store.py tests/test_startup_recovery.py tests/test_api_ext.py -q
      - name: Commit generated refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/audio_score_tool/song_api_v2.py src/audio_score_tool/api_ext.py
          git commit -m "feat: use incremental job ingestion [skip ci]"
          git push origin HEAD:stabilize-runtime-release-v0.8
