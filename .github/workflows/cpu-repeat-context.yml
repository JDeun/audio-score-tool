name: CPU Repeat Context

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - '.github/workflows/cpu-repeat-context.yml'
      - 'scripts/run_repeat_context.py'
      - 'scripts/repeat_context_phase.py'
      - 'scripts/repeat_context_study.py'
      - 'scripts/nasap_repeat_context_source.py'
      - 'scripts/nasap_repeat_context_manifest.json'
      - 'tests/test_run_repeat_context.py'
      - 'tests/test_repeat_context_phase.py'
      - 'tests/test_repeat_context_study.py'
      - 'tests/test_nasap_repeat_context_source.py'
      - 'docs/research/REPEAT_CONTEXT_PROTOCOL_2026-11-13.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repeat-context-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: '0'
  CUDA_VISIBLE_DEVICES: ''
  HF_TOKEN: ''
  HUGGING_FACE_HUB_TOKEN: ''
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  EXPERIMENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  study:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install pinned MIDI parser and contract tools
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            mido==1.3.3 pytest==8.4.2 ruff==0.16.6
      - name: Validate repeat-context, source, evaluation and execution contracts
        run: |
          python -m ruff check scripts/run_repeat_context.py \
            scripts/repeat_context_phase.py scripts/nasap_repeat_context_source.py \
            scripts/repeat_context_study.py tests/test_run_repeat_context.py \
            tests/test_repeat_context_phase.py tests/test_nasap_repeat_context_source.py \
            tests/test_repeat_context_study.py
          python -m compileall -q scripts/run_repeat_context.py \
            scripts/repeat_context_phase.py scripts/nasap_repeat_context_source.py \
            scripts/repeat_context_study.py
          mkdir -p "$RUNNER_TEMP/repeat-context-tests"
          cp tests/test_run_repeat_context.py tests/test_repeat_context_phase.py \
            tests/test_nasap_repeat_context_source.py tests/test_repeat_context_study.py \
            "$RUNNER_TEMP/repeat-context-tests/"
          python -m pytest -q -p no:cacheprovider -c /dev/null "$RUNNER_TEMP/repeat-context-tests"
      - name: Preserve all 1520 predictions before four-cohort evaluation
        run: |
          python -m scripts.run_repeat_context \
            --work "$RUNNER_TEMP/private-repeat-context" \
            --output "$RUNNER_TEMP/repeat-context-report/report.json"
      - name: Preserve the planned population when preparation or contracts block execution
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ['RUNNER_TEMP']) / 'repeat-context-report/report.json'
          if not output.exists():
              output.parent.mkdir(parents=True, exist_ok=True)
              plan = {
                  'reused_authored': [f'syn{i:03d}' for i in range(1, 485)],
                  'factorial_authored': [f'fac{i:04d}' for i in range(1, 1029)],
                  'reused_real': [f'nasap{i:03d}' for i in range(1, 5)],
                  'additional_real': [f'nasap{i:03d}' for i in range(5, 9)],
              }
              report = {
                  'schema_version': 1, 'status': 'execution_not_started',
                  'failure_stage': 'workflow_preparation_or_contracts',
                  'reason': 'A required workflow step failed before a study receipt was available.',
                  'expected_scope_case_counts': {scope: len(ids) for scope, ids in plan.items()},
                  'planned_inferences': 1520, 'completed_inferences': 0,
                  'completed_preservation_checks': 0,
                  'planned_ids': [tid for ids in plan.values() for tid in ids], 'planned_scopes': plan,
                  'cases': [{'id': tid, 'scope': scope, 'status': 'planned',
                             'evaluation_status': 'pending', 'input_file_sha256': None,
                             'prediction_file_sha256': None, 'event_mutation_check_passed': False}
                            for scope, ids in plan.items() for tid in ids],
                  'evaluation': None, 'summary': None,
                  'evaluation_started': False, 'all_predictions_saved_before_evaluation': False,
                  'evaluation_loading_started': False,
                  'evaluation_loaded': {scope: False for scope in plan},
                  'source_head': os.environ.get('EXPERIMENT_HEAD'),
                  'source_revision': os.environ.get('GITHUB_SHA'),
                  'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
                  'workflow_run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              }
              output.write_text(json.dumps(report, indent=2, allow_nan=False) + '\n')
          PY
      - name: Upload derived evaluation metadata only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repeat-context-${{ github.run_id }}
          path: ${{ runner.temp }}/repeat-context-report/report.json
          retention-days: 14
          if-no-files-found: warn
