name: CPU KRAISLER Frozen Gate Transfer

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - '.github/workflows/cpu-kraisler-gate.yml'
      - 'scripts/run_kraisler_gate.py'
      - 'scripts/kraisler_source.py'
      - 'scripts/kraisler_gate_eval.py'
      - 'scripts/kraisler_gate_manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kraisler-gate-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
  PYTHONHASHSEED: '0'
  CUDA_VISIBLE_DEVICES: ''
  HF_TOKEN: ''
  HUGGING_FACE_HUB_TOKEN: ''
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  NUMBA_NUM_THREADS: '2'
  EXPERIMENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  gate-transfer:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Install unchanged CPU ONNX research runtime
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 scipy==1.13.1 mir-eval==0.8.2 librosa==0.10.2.post1 \
            soundfile==0.13.1 resampy==0.4.2 numba==0.60.0 mido==1.3.3 \
            music21==9.7.1 pretty-midi==0.2.10 onnxruntime==1.20.1 \
            pytest==8.4.2 ruff==0.16.6
          python -m pip install --no-deps basic-pitch==0.4.0
      - name: Validate source, evaluator and frozen predictor contracts
        run: |
          python -m ruff check scripts/run_kraisler_gate.py scripts/kraisler_source.py \
            scripts/kraisler_gate_eval.py tests/test_kraisler_source.py tests/test_kraisler_gate_eval.py \
            tests/test_run_kraisler_gate.py
          python -m compileall -q scripts/run_kraisler_gate.py scripts/kraisler_source.py scripts/kraisler_gate_eval.py
          mkdir -p "$RUNNER_TEMP/kraisler-tests"
          cp tests/test_kraisler_source.py tests/test_kraisler_gate_eval.py \
            tests/test_run_kraisler_gate.py "$RUNNER_TEMP/kraisler-tests/"
          python -m pytest -q -p no:cacheprovider -c /dev/null "$RUNNER_TEMP/kraisler-tests"
          python -c 'from scripts.run_kraisler_gate import validate_frozen_sources; validate_frozen_sources()'
      - name: Evaluate six fixed original dry stems once each
        run: |
          python -m scripts.run_kraisler_gate \
            --work "$RUNNER_TEMP/private-kraisler-gate" \
            --output "$RUNNER_TEMP/kraisler-report/report.json"
      - name: Upload derived metadata receipt only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kraisler-gate-${{ github.run_id }}
          path: ${{ runner.temp }}/kraisler-report/report.json
          retention-days: 14
          if-no-files-found: warn
