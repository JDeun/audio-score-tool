name: Refresh Desktop Rust Lock

permissions:
  contents: write

on:
  push:
    branches:
      - desktop-polish-updater-v0.8
    paths:
      - desktop/src-tauri/Cargo.toml

concurrency:
  group: refresh-desktop-rust-lock
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: desktop-polish-updater-v0.8
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Refresh Cargo.lock
        working-directory: desktop/src-tauri
        run: cargo generate-lockfile
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- desktop/src-tauri/Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src-tauri/Cargo.lock
          git commit -m "chore: refresh desktop Rust lockfile"
          git push origin HEAD:desktop-polish-updater-v0.8
