name: CPU Drum Event Lanes Fixed Experiment

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - '.github/workflows/cpu-drum-event-lanes.yml'
      - 'scripts/drum_event_lanes.py'
      - 'scripts/drum_event_metrics.py'
      - 'scripts/drum_lane_source.py'
      - 'scripts/drum_lane_controls.py'
      - 'scripts/run_drum_event_lanes.py'
      - 'scripts/audit_drum_event_lanes.py'
      - 'tests/test_drum_event_lanes.py'
      - 'tests/test_drum_event_metrics.py'
      - 'tests/test_drum_lane_controls.py'
      - 'tests/test_run_drum_event_lanes.py'
      - 'tests/test_audit_drum_event_lanes.py'

permissions:
  contents: read

concurrency:
  group: drum-event-lanes-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  CUDA_VISIBLE_DEVICES: ''
  HF_TOKEN: ''
  HUGGING_FACE_HUB_TOKEN: ''
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  EXPERIMENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  drum-event-lanes:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'
      - name: Install fixed isolated CPU runtime
        run: |
          python -m venv "$RUNNER_TEMP/drum-lanes-venv"
          "$RUNNER_TEMP/drum-lanes-venv/bin/python" -m pip install \
            numpy==1.26.4 scipy==1.13.1 mido==1.3.3 \
            threadpoolctl==3.6.0 PyYAML==6.0.3 pytest==8.4.2 ruff==0.16.6
          "$RUNNER_TEMP/drum-lanes-venv/bin/python" -m pip check
      - name: Verify frozen source and executable contracts before data access
        run: |
          "$RUNNER_TEMP/drum-lanes-venv/bin/python" -m ruff check \
            scripts/drum_event_lanes.py scripts/drum_event_metrics.py \
            scripts/drum_lane_controls.py scripts/drum_lane_source.py \
            scripts/run_drum_event_lanes.py scripts/audit_drum_event_lanes.py \
            tests/test_drum_event_lanes.py tests/test_drum_event_metrics.py \
            tests/test_drum_lane_controls.py tests/test_run_drum_event_lanes.py \
            tests/test_audit_drum_event_lanes.py
          "$RUNNER_TEMP/drum-lanes-venv/bin/python" -m pytest -q \
            tests/test_drum_event_lanes.py tests/test_drum_event_metrics.py \
            tests/test_drum_lane_controls.py tests/test_run_drum_event_lanes.py \
            tests/test_audit_drum_event_lanes.py
      - name: Fetch pinned MIDI archive for metadata and later reference access
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --max-time 240 --retry 2 --max-filesize 8000000 \
            'https://storage.googleapis.com/magentadata/datasets/groove/groove-v1.0.0-midionly.zip' \
            --output "$RUNNER_TEMP/drum-lanes-midi.zip"
          printf '%s  %s\n' '651cbc524ffb891be1a3e46d89dc82a1cecb09a57c748c7b45b844c4841dcc1e' "$RUNNER_TEMP/drum-lanes-midi.zip" | sha256sum --check
      - name: Qualify native inputs and freeze all predictions before references
        run: |
          "$RUNNER_TEMP/drum-lanes-venv/bin/python" -m scripts.run_drum_event_lanes \
            --midi-zip "$RUNNER_TEMP/drum-lanes-midi.zip" \
            --work "$RUNNER_TEMP/drum-lanes-private" \
            --output "$RUNNER_TEMP/drum-lanes-reports"
      - name: Independently audit input bytes and raw event results
        run: |
          "$RUNNER_TEMP/drum-lanes-venv/bin/python" -m scripts.audit_drum_event_lanes \
            --reports "$RUNNER_TEMP/drum-lanes-reports" \
            --work "$RUNNER_TEMP/drum-lanes-private"
      - name: Preserve failure without inventing musical results
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'drum-lanes-reports'
          root.mkdir(parents=True, exist_ok=True)
          if not (root / 'report.json').exists() and not (root / 'failure.json').exists():
              (root / 'failure.json').write_text(json.dumps({
                  'schema': 'drum-event-lanes-v1', 'status': 'not_completed',
                  'source_revision': os.environ['GITHUB_SHA'],
                  'protocol_head_revision': os.environ['EXPERIMENT_HEAD_SHA'],
                  'quality_approved': False, 'aggregate': None,
                  'reason': 'workflow failed before completed scientific report'}) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: drum-event-lanes-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/drum-lanes-reports/*.json
          retention-days: 14
          if-no-files-found: error
