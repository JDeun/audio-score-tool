name: CPU GMD Ranged Real WAV Onsets (No Full Dataset Download)

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - '.github/workflows/cpu-gmd-audio-range.yml'
      - 'scripts/gmd_audio_range_probe.py'
      - 'scripts/run_gmd_audio_range_probe.py'
      - 'tests/test_gmd_audio_range_probe.py'
    branches:
      - research/drum-meter-metadata-gmd-20261111
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-gmd-wav-range-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  CUDA_VISIBLE_DEVICES: ''
  HF_TOKEN: ''
  HUGGING_FACE_HUB_TOKEN: ''

jobs:
  bounded-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Pinned CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==1.26.4 \
            scipy==1.13.1 mido==1.3.3 pytest==8.4.2 ruff==0.16.6
          python -m pip check
      - name: Lint, compile and test bounded ranged access and raw DSP scoring
        run: |
          python -m ruff check scripts/gmd_audio_range_probe.py scripts/run_gmd_audio_range_probe.py tests/test_gmd_audio_range_probe.py
          python -m compileall -q scripts/gmd_audio_range_probe.py scripts/run_gmd_audio_range_probe.py
          python -m pytest -q tests/test_gmd_audio_range_probe.py
      - name: Download checksum-verified MIDI-only metadata, not the full audio archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --max-time 240 --retry 3 --max-filesize 8000000 \
            'https://storage.googleapis.com/magentadata/datasets/groove/groove-v1.0.0-midionly.zip' \
            --output "$RUNNER_TEMP/groove-midionly.zip"
          printf '%s  %s\n' '651cbc524ffb891be1a3e46d89dc82a1cecb09a57c748c7b45b844c4841dcc1e' "$RUNNER_TEMP/groove-midionly.zip" | sha256sum --check
      - name: Probe HTTP Range and compare audio-only detector against MIDI annotation
        run: |
          mkdir -p "$RUNNER_TEMP/gmd-wav-report"
          python -m scripts.run_gmd_audio_range_probe \
            --midi-zip "$RUNNER_TEMP/groove-midionly.zip" \
            --report "$RUNNER_TEMP/gmd-wav-report/report.json"
      - name: Upload metadata only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gmd-real-wave-range-${{ github.run_id }}
          path: ${{ runner.temp }}/gmd-wav-report/report.json
          retention-days: 14
          if-no-files-found: warn
