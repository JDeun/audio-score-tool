name: CPU Bar Sum Joint Rhythm Study

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - '.github/workflows/cpu-bar-sum-rhythm.yml'
      - 'scripts/bar_sum_rhythm.py'
      - 'scripts/run_bar_sum_rhythm.py'
      - 'tests/test_bar_sum_rhythm.py'
      - 'docs/research/BAR_SUM_RHYTHM_PROTOCOL_2026-11-11.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bar-sum-rhythm-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: '0'
  CUDA_VISIBLE_DEVICES: ''
  HF_TOKEN: ''
  HUGGING_FACE_HUB_TOKEN: ''
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  EXPERIMENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  study:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'
      - name: Validate the exact DP, pickup ambiguity and immutable attack contracts
        run: |
          python -m compileall -q scripts/bar_sum_rhythm.py scripts/run_bar_sum_rhythm.py tests/test_bar_sum_rhythm.py
          python -m unittest discover -s tests -p test_bar_sum_rhythm.py -v
      - name: Run all frozen authored phrases and performance variations on CPU
        run: |
          python -m scripts.run_bar_sum_rhythm --output "$RUNNER_TEMP/bar-sum/report.json"
      - name: Upload only the explicitly scoped authored-symbolic receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bar-sum-rhythm-${{ github.run_id }}
          path: ${{ runner.temp }}/bar-sum/report.json
          if-no-files-found: error
          retention-days: 14
