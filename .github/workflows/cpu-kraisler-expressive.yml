name: CPU KRAISLER Local Timing and Rhythm Ranges

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - '.github/workflows/cpu-kraisler-expressive.yml'
      - 'scripts/run_kraisler_expressive.py'
      - 'scripts/kraisler_local_clock.py'
      - 'scripts/kraisler_rhythm_ranges.py'
      - 'scripts/kraisler_expressive.py'
      - 'tests/test_run_kraisler_expressive.py'
      - 'tests/test_kraisler_local_clock.py'
      - 'tests/test_kraisler_rhythm_ranges.py'
      - 'tests/test_kraisler_expressive.py'
      - 'docs/research/KRAISLER_EXPRESSIVE_PROTOCOL_2026-11-12.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kraisler-expressive-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: '0'
  CUDA_VISIBLE_DEVICES: ''
  HF_TOKEN: ''
  HUGGING_FACE_HUB_TOKEN: ''
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  EXPERIMENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  expressive-diagnostics:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install pinned contract tools for the standard-library study
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            pytest==8.4.2 ruff==0.16.6
      - name: Validate local clock, range, attribution and execution contracts
        run: |
          python -m ruff check scripts/run_kraisler_expressive.py \
            scripts/kraisler_local_clock.py scripts/kraisler_rhythm_ranges.py \
            scripts/kraisler_expressive.py tests/test_run_kraisler_expressive.py \
            tests/test_kraisler_local_clock.py tests/test_kraisler_rhythm_ranges.py \
            tests/test_kraisler_expressive.py
          python -m compileall -q scripts/run_kraisler_expressive.py \
            scripts/kraisler_local_clock.py scripts/kraisler_rhythm_ranges.py \
            scripts/kraisler_expressive.py
          mkdir -p "$RUNNER_TEMP/kraisler-expressive-tests"
          cp tests/test_run_kraisler_expressive.py tests/test_kraisler_local_clock.py \
            tests/test_kraisler_rhythm_ranges.py tests/test_kraisler_expressive.py \
            "$RUNNER_TEMP/kraisler-expressive-tests/"
          python -m pytest -q -p no:cacheprovider -c /dev/null "$RUNNER_TEMP/kraisler-expressive-tests"
      - name: Analyze six fixed sources before loading historical outcomes
        run: |
          python -m scripts.run_kraisler_expressive \
            --work "$RUNNER_TEMP/private-kraisler-expressive" \
            --output "$RUNNER_TEMP/kraisler-expressive-report/report.json"
      - name: Preserve a receipt when preparation or contracts block execution
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ['RUNNER_TEMP']) / 'kraisler-expressive-report/report.json'
          if not output.exists():
              output.parent.mkdir(parents=True, exist_ok=True)
              report = {
                  'schema_version': 1, 'status': 'execution_not_started',
                  'failure_stage': 'workflow_preparation_or_contracts',
                  'reason': 'A required workflow step failed before a study receipt was available.',
                  'planned_ids': ['02', '19', '08', '12', '05', '06'],
                  'planned_analyses': 6, 'completed_analyses': 0,
                  'completed_baseline_verifications': 0, 'completed_attributions': 0,
                  'synthetic_controls': None, 'cases': [], 'summary': None,
                  'alignment_baseline_loaded': False, 'gate_receipt_loaded': False,
                  'analysis_phase_completed_before_prior_receipts': False,
                  'source_head': os.environ.get('EXPERIMENT_HEAD'),
                  'source_revision': os.environ.get('GITHUB_SHA'),
                  'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
                  'workflow_run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              }
              output.write_text(json.dumps(report, indent=2, allow_nan=False) + '\n')
          PY
      - name: Upload derived expressive-timing diagnostics only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kraisler-expressive-${{ github.run_id }}
          path: ${{ runner.temp }}/kraisler-expressive-report/report.json
          retention-days: 14
          if-no-files-found: warn
