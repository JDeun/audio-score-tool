name: CPU Real nASAP Performance Duration and Unit Pilot

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - research/tempo-unit-selection-20261112
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-nasap-duration-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: '0'
  CUDA_VISIBLE_DEVICES: ''
  HF_TOKEN: ''
  HUGGING_FACE_HUB_TOKEN: ''
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'

jobs:
  real-duration:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Install bounded regression tools, no models or GPU dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2 ruff==0.16.6
          python -m pip check
      - name: Check no-reference selection and privileged-clock contracts
        run: |
          python -m ruff check scripts/nasap_duration_probe.py tests/test_nasap_duration_probe.py
          python -m compileall -q scripts/nasap_duration_probe.py
          python -m pytest -q tests/test_nasap_duration_probe.py
      - name: Execute frozen real paired-performance pilot
        run: |
          mkdir -p "$RUNNER_TEMP/nasap-duration"
          python -m scripts.nasap_duration_probe --output "$RUNNER_TEMP/nasap-duration/report.json"
      - name: Upload derived counts only, no original score or performance data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nasap-duration-${{ github.run_id }}
          path: ${{ runner.temp }}/nasap-duration/report.json
          if-no-files-found: warn
          retention-days: 14
