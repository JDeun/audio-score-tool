name: CPU Paired nASAP Key-off vs Sustain Duration

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - research/nasap-duration-unit-20261112
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cpu-nasap-keyoff-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: '0'
  CUDA_VISIBLE_DEVICES: ''
  HF_TOKEN: ''
  HUGGING_FACE_HUB_TOKEN: ''
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'

jobs:
  paired-endpoints:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Install pinned CPU-only regression and MIDI runtime
        run: |
          python -m pip install --disable-pip-version-check mido==1.3.3 pytest==8.4.2 ruff==0.16.6
          python -m pip check
      - name: Validate fixed cohorts, key-off mapping, clock arithmetic and representability
        run: |
          python -m ruff check scripts/nasap_keyoff_paired.py tests/test_nasap_keyoff_paired.py
          python -m compileall -q scripts/nasap_keyoff_paired.py
          python -m pytest -q tests/test_nasap_keyoff_paired.py tests/test_nasap_duration_probe.py tests/test_nasap_duration_source.py
      - name: Fetch immutable same-repository prior evidence, read only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/artifacts/13908396922/zip" > "$RUNNER_TEMP/nasap-previous.zip"
          printf '%s  %s\n' '8aae98a772c0a6494ba243ebe0f123d0a3de7e1d4d44108dd5f61cb7ebf170b8' "$RUNNER_TEMP/nasap-previous.zip" | sha256sum --check
      - name: Evaluate fixed six arms without source replacements or score-guided input choice
        run: |
          mkdir -p "$RUNNER_TEMP/nasap-keyoff"
          python -m scripts.nasap_keyoff_paired --previous "$RUNNER_TEMP/nasap-previous.zip" --output "$RUNNER_TEMP/nasap-keyoff/report.json"
      - name: Include experiment code for independent offline arithmetic and regression checks
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/nasap-keyoff/reproduction/scripts" "$RUNNER_TEMP/nasap-keyoff/reproduction/tests"
          cp scripts/nasap_keyoff_paired.py scripts/nasap_duration_probe.py scripts/audit_nasap_duration_source.py "$RUNNER_TEMP/nasap-keyoff/reproduction/scripts/"
          cp tests/test_nasap_keyoff_paired.py tests/test_nasap_duration_probe.py tests/test_nasap_duration_source.py "$RUNNER_TEMP/nasap-keyoff/reproduction/tests/"
      - name: Upload derived receipt and our experiment code, never musical source files
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nasap-keyoff-paired-${{ github.run_id }}
          path: ${{ runner.temp }}/nasap-keyoff/
          if-no-files-found: warn
          retention-days: 14
