name: Refresh Python Lock (temporary)

permissions:
  contents: write

on:
  push:
    branches:
      - fix/final-hygiene-pass
    paths:
      - pyproject.toml
      - .github/workflows/refresh-lock-temp.yml

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/final-hygiene-pass
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.10
      - name: Regenerate lock
        run: uv lock
      - name: Commit refreshed lock
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already matches pyproject.toml"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh Python lockfile"
          git push origin HEAD:fix/final-hygiene-pass
