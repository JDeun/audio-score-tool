name: Desktop Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Explain unsigned-only tag builds
        if: vars.RELEASE_SIGNING_READY != 'true'
        run: |
          echo "RELEASE_SIGNING_READY is not true. Installers will be built as CI artifacts only."
          echo "No public GitHub Release will be created."

      - name: Create draft GitHub Release
        if: vars.RELEASE_SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "AudioScoreTool $GITHUB_REF_NAME" \
              --notes "Windows NSIS installer (.exe) and macOS disk image (.dmg)."

  build:
    needs: prepare-release
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: windows
          - os: macos-15
            name: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.10
          enable-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1

      - name: Verify dependency locks
        run: uv lock --check

      - name: Verify Rust lock
        run: cargo metadata --locked --manifest-path desktop/src-tauri/Cargo.toml --format-version 1 --no-deps

      - name: Install Python desktop build dependencies
        run: uv sync --frozen --extra desktop

      - name: Install desktop frontend
        working-directory: desktop
        run: npm ci

      - name: Generate platform icons
        working-directory: desktop
        run: npx --no-install tauri icon src-tauri/icons/icon.png

      - name: Build packaged sidecar
        working-directory: desktop
        run: uv run --project .. --frozen --extra desktop python ../scripts/build_sidecar.py

      - name: Smoke packaged sidecar
        working-directory: desktop
        run: uv run --project .. --frozen --extra desktop python ../scripts/smoke_packaged_sidecar.py

      - name: Validate Windows signing secrets
        if: runner.os == 'Windows' && vars.RELEASE_SIGNING_READY == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { throw "WINDOWS_CERTIFICATE is required" }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw "WINDOWS_CERTIFICATE_PASSWORD is required" }
          if (-not $env:WINDOWS_CERTIFICATE_THUMBPRINT) { throw "WINDOWS_CERTIFICATE_THUMBPRINT is required" }
          if (-not $env:WINDOWS_TIMESTAMP_URL) { throw "WINDOWS_TIMESTAMP_URL repository variable is required" }

      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows' && vars.RELEASE_SIGNING_READY == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Path certificate -Force | Out-Null
          Set-Content -Path certificate/certificate.b64 -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/certificate.b64 certificate/certificate.pfx | Out-Null
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null

      - name: Build signed Windows NSIS installer
        if: runner.os == 'Windows' && vars.RELEASE_SIGNING_READY == 'true'
        working-directory: desktop
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT
                digestAlgorithm = "sha256"
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
              }
            }
          } | ConvertTo-Json -Depth 6
          Set-Content -Path tauri.release.windows.json -Value $config
          npx --no-install tauri build --bundles nsis --config tauri.release.windows.json

      - name: Build unsigned Windows NSIS installer for CI artifact
        if: runner.os == 'Windows' && vars.RELEASE_SIGNING_READY != 'true'
        working-directory: desktop
        run: npx --no-install tauri build --bundles nsis

      - name: Validate macOS signing secrets
        if: runner.os == 'macOS' && vars.RELEASE_SIGNING_READY == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          test -n "$KEYCHAIN_PASSWORD"

      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && vars.RELEASE_SIGNING_READY == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application/{print $2; exit}')
          test -n "$CERT_ID"
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Build signed and notarized macOS DMG
        if: runner.os == 'macOS' && vars.RELEASE_SIGNING_READY == 'true'
        working-directory: desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        run: npx --no-install tauri build --bundles dmg

      - name: Build ad-hoc signed macOS DMG for CI artifact
        if: runner.os == 'macOS' && vars.RELEASE_SIGNING_READY != 'true'
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npx --no-install tauri build --bundles dmg

      - name: Verify Windows installer signature
        if: runner.os == 'Windows' && vars.RELEASE_SIGNING_READY == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature: $($signature.Status)" }

      - name: Verify macOS package trust
        if: runner.os == 'macOS' && vars.RELEASE_SIGNING_READY == 'true'
        run: |
          APP_PATH=$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          DMG_PATH=$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Upload Windows EXE artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AudioScoreTool-Windows-Setup-EXE
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload macOS DMG artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AudioScoreTool-macOS-DMG
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload signed Windows installer to draft release
        if: runner.os == 'Windows' && vars.RELEASE_SIGNING_READY == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          gh release upload "$env:GITHUB_REF_NAME" "$($installer.FullName)" --repo "$env:GITHUB_REPOSITORY" --clobber

      - name: Upload notarized macOS DMG to draft release
        if: runner.os == 'macOS' && vars.RELEASE_SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG_PATH=$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          gh release upload "$GITHUB_REF_NAME" "$DMG_PATH" --repo "$GITHUB_REPOSITORY" --clobber

  publish-release:
    needs: build
    if: vars.RELEASE_SIGNING_READY == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Publish verified desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
