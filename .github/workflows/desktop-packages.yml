name: Desktop Packages

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/desktop-packages.yml"
      - "desktop/**"
      - "scripts/backend_entry.py"
      - "scripts/build_sidecar.py"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: windows-2025
            name: windows
          - os: macos-15
            name: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.10
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1

      - name: Verify dependency locks
        run: uv lock --check

      - name: Verify Rust lock
        run: cargo metadata --locked --manifest-path desktop/src-tauri/Cargo.toml --format-version 1 --no-deps

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Python desktop build dependencies
        run: uv sync --frozen --extra desktop

      - name: Install desktop frontend
        working-directory: desktop
        run: npm ci

      - name: Generate platform icons
        working-directory: desktop
        run: npx --no-install tauri icon src-tauri/icons/icon.png

      - name: Build desktop package
        working-directory: desktop
        run: npm run desktop:build

      - name: Upload unsigned bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AudioScoreTool-${{ matrix.name }}-unsigned
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
