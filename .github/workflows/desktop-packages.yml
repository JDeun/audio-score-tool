name: Desktop Packages

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: windows-2025
            name: windows
          - os: macos-15
            name: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Python desktop build dependencies
        run: uv sync --extra desktop

      - name: Install desktop frontend
        working-directory: desktop
        run: npm install

      - name: Generate platform icons
        working-directory: desktop
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build desktop package
        working-directory: desktop
        run: npm run desktop:build

      - name: Upload unsigned bundles
        uses: actions/upload-artifact@v4
        with:
          name: AudioScoreTool-${{ matrix.name }}-unsigned
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
