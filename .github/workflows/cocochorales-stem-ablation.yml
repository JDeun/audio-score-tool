name: Mix vs separated stems AMT (research-only)

# Both arms use the same original audio, reference, model weights and runtime.
# All six estimated stems are transcribed, including empty/irrelevant stems.
# Source audio, stems, MIDI and checkpoint bytes remain on the ephemeral runner.
on:
  pull_request:
    paths:
      - '.github/workflows/cocochorales-stem-ablation.yml'
      - 'scripts/run_cocochorales_stem_ablation.py'
      - 'scripts/separate_benchmark_stems.py'
      - 'src/audio_score_tool/stem_ablation.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coco-stem-ablation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  same-model-same-source:
    name: ${{ matrix.model }} / mix vs all 6 estimated stems
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        model: [mr_mt3, yourmt3]
    env:
      MT3_MODEL: ${{ matrix.model }}
      TORCH_HOME: ${{ runner.temp }}/stem-private-torch
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - name: Checkout the experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup isolated model runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'

      - name: Install pinned AMT and Demucs with CPU PyTorch
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check \
            'torch==2.7.1' 'torchaudio==2.7.1' 'torchvision==0.22.1' \
            --index-url https://download.pytorch.org/whl/cpu
          if [ "$MT3_MODEL" = mr_mt3 ]; then
            TRANSFORMERS_VERSION=4.57.6
          else
            TRANSFORMERS_VERSION=4.44.2
          fi
          python -m pip install --disable-pip-version-check \
            'mt3-infer[torch]==0.2.0' "transformers==$TRANSFORMERS_VERSION" \
            'demucs==4.0.1' 'soundfile==0.13.1' 'defusedxml==0.7.1' \
            'mido==1.3.3' 'mutagen==1.48.1' 'music21==10.5.0'
          python -m pip install --disable-pip-version-check -e .

      - name: Obtain and verify original author audio and independent MIDI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stem-download" "$RUNNER_TEMP/stem-evidence"
          for track in string_track001010 brass_track049013 woodwind_track097010 random_track145011; do
            curl --fail --location --silent --show-error \
              --proto '=https' --proto-redir '=https' \
              --connect-timeout 30 --max-time 600 --retry 3 --retry-delay 3 \
              --output "$RUNNER_TEMP/stem-download/$track.zip" \
              "https://raw.githubusercontent.com/lukewys/lukewys.github.io/7a0b15e7be365a6b062027c38ce0f8d57ed1d98a/cocochorales/assets/sample_examples/pieces/$track.zip"
            python -m scripts.prepare_cocochorales_official_sample \
              --archive "$RUNNER_TEMP/stem-download/$track.zip" --track-id "$track" \
              --corpus-root "$RUNNER_TEMP/stem-source-$track" \
              --metadata-root "$RUNNER_TEMP/stem-evidence/$track"
          done

      - name: Obtain exact independently SHA-verified AMT checkpoint
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MT3_MODEL" = mr_mt3 ]; then
            FETCH_MODULE=scripts.fetch_pinned_mrmt3_checkpoint
          else
            FETCH_MODULE=scripts.fetch_pinned_yourmt3_checkpoint
          fi
          python -m "$FETCH_MODULE" \
            --checkpoint-dir "$RUNNER_TEMP/stem-private-model" \
            --cache-dir "$RUNNER_TEMP/stem-model-cache" \
            --output "$RUNNER_TEMP/stem-evidence/model-source.pending.json"

      - name: Measure both arms on all four original recordings
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for track in string_track001010 brass_track049013 woodwind_track097010 random_track145011; do
            python -m scripts.run_cocochorales_stem_ablation \
              --pairs "$RUNNER_TEMP/stem-evidence/$track/pairs.json" \
              --registry "$RUNNER_TEMP/stem-evidence/$track/reviewed-registry.json" \
              --source-proof "$RUNNER_TEMP/stem-evidence/$track/source-proof.pending.json" \
              --corpus-root "$RUNNER_TEMP/stem-source-$track" \
              --work-root "$RUNNER_TEMP/stem-private-work-$track" \
              --checkpoint-root "$RUNNER_TEMP/stem-private-model" \
              --model "$MT3_MODEL" --separator htdemucs_6s --device cpu \
              --output "$RUNNER_TEMP/stem-evidence/$track/ablation.pending.json" || failed=1
          done
          python -m scripts.run_cocochorales_stem_ablation \
            --aggregate "$RUNNER_TEMP"/stem-evidence/*/ablation.pending.json \
            --output "$RUNNER_TEMP/stem-evidence/four-ensemble-ablation.pending.json" || failed=1
          exit "$failed"

      - name: Summarize complete pairs without publishing music
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'stem-evidence/four-ensemble-ablation.pending.json'
          if path.is_file():
              report = json.loads(path.read_text())
              summary = {
                  'model': report['model_identity']['model'],
                  'complete_paired_cases': report['complete_paired_case_count'],
                  'macro_f1': report['macro_f1'],
                  'stems_minus_mix_f1': report['macro_stems_minus_mix_f1'],
                  'heldout_generalization_measured': False,
                  'release_quality_approved': False,
              }
              print(json.dumps(summary, sort_keys=True))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write('## Engine-level mix vs estimated-stem experiment\n\n')
                  output.write('Four upstream train examples; no release or PDF-quality claim.\n\n')
                  output.write('```json\n' + json.dumps(summary, indent=2) + '\n```\n')
          PY

      - name: Upload metadata only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coco-${{ matrix.model }}-mix-vs-stems-pending
          path: |
            ${{ runner.temp }}/stem-evidence/model-source.pending.json
            ${{ runner.temp }}/stem-evidence/four-ensemble-ablation.pending.json
            ${{ runner.temp }}/stem-evidence/*/source-proof.pending.json
            ${{ runner.temp }}/stem-evidence/*/ablation.pending.json
          if-no-files-found: warn
          retention-days: 30
