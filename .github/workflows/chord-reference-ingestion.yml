name: Chord Reference Ingestion

on:
  pull_request:
    paths:
      - '.github/workflows/chord-reference-ingestion.yml'
      - 'scripts/import_chord_reference.py'
      - 'tests/test_import_chord_reference.py'
      - 'scripts/score_casd_chords.py'
      - 'docs/CHORD_REFERENCE_INGESTION.ko.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/chord-reference-ingestion.yml'
      - 'scripts/import_chord_reference.py'
      - 'tests/test_import_chord_reference.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chord-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  annotation-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.10
          python-version: '3.12'
      - name: Install frozen test dependencies
        run: uv sync --frozen --extra dev
      - name: Run no-network multi-reference annotation integration tests
        run: uv run --frozen --with mir_eval==0.8.2 pytest -q tests/test_import_chord_reference.py tests/test_import_casd_annotations.py tests/test_score_casd_chords.py
      - name: Verify direct CLI
        run: uv run --frozen python scripts/import_chord_reference.py --help
