name: MT3 Native Frozen Runtime Review (unapproved)

# Native Windows/macOS frozen PyTorch acceptance, NOT public release. Only
# SHA-256/provenance JSON is uploaded, never executable/model archives.
on:
  pull_request:
    paths:
      - '.github/workflows/mt3-frozen-native-review.yml'
      - 'scripts/mt3_frozen_entry.py'
      - 'scripts/verify_mt3_frozen_native.py'
      - 'scripts/fetch_pinned_mrmt3_checkpoint.py'
      - 'tests/test_pinned_mrmt3_checkpoint_fetch.py'
      - 'scripts/collect_mt3_frozen_inventory.py'
      - 'scripts/map_mt3_frozen_file_owners.py'
      - 'tests/test_mt3_frozen_file_owners.py'
      - 'scripts/triage_mt3_frozen_dependencies.py'
      - 'tests/test_mt3_frozen_license_triage.py'
      - 'tests/test_mt3_frozen_inventory.py'
      - 'tests/test_mt3_private_candidate_audit.py'
      - 'scripts/generate_tier2_smoke_audio.py'
      - 'scripts/run_tier2_model_smoke.py'
      - 'src/audio_score_tool/transcription_engine.py'
      - 'tests/test_mt3_frozen_native_review.py'
      - 'src/audio_score_tool/managed_components.py'
      - 'src/audio_score_tool/managed_tool_resolver.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mt3-frozen-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: native-mt3-frozen-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-x86_64
          - runner: macos-15
            target: macos-aarch64
    steps:
      - name: Checkout reviewed runtime verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup native Python 3.11 (builder only)
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'

      - name: Install pinned MR-MT3/PyTorch frozen runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'mt3-infer[torch]==0.2.0' \
            'torch==2.7.1' \
            'torchaudio==2.7.1' \
            'torchvision==0.22.1' \
            'transformers==4.57.6' \
            'pyinstaller==6.17.0' \
            'music21==10.5.0'
          python - <<'PY'
          from importlib.metadata import version
          for package, expected in {
              "mt3-infer": "0.2.0", "torch": "2.7.1",
              "torchaudio": "2.7.1", "torchvision": "0.22.1",
              "transformers": "4.57.6", "PyInstaller": "6.17.0",
              "music21": "10.5.0",
          }.items():
              actual = version(package)
              if actual != expected:
                  raise RuntimeError(f"{package}: expected {expected}, observed {actual}")
          PY

      - name: Download SHA-pinned original MR-MT3 weights on private CI runner
        shell: bash
        env:
          MT3_CHECKPOINT_DIR: ${{ runner.temp }}/ast-native-reviewed-mrmt3
          # Host Python uses CP1252 on redirected Windows streams by default.
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          # Never fetch mutable HF main: use the immutable snapshot and verify
          # the full checkpoint SHA before any legacy torch.load(weights_only=False).
          python -X utf8 -m scripts.fetch_pinned_mrmt3_checkpoint \
            --checkpoint-dir "$MT3_CHECKPOINT_DIR" \
            --cache-dir "$RUNNER_TEMP/ast-mrmt3-hf-cache" \
            --output "$RUNNER_TEMP/MR-MT3-SOURCE-EVIDENCE.pending.json"

      - name: Freeze real MT3-Infer and verify app-owned executable
        shell: bash
        env:
          REVIEW_TARGET: ${{ matrix.target }}
          MT3_CHECKPOINT_DIR: ${{ runner.temp }}/ast-native-reviewed-mrmt3
          PYTHONPATH: ${{ github.workspace }}${{ runner.os == 'Windows' && ';' || ':' }}${{ github.workspace }}/src
        run: |
          set -euo pipefail
          # Binary is private and includes the frozen Python runtime.
          # Actual pinned weights are installed only in a private QA ZIP.
          # No model, executable or third-party archive is uploaded.
          python scripts/verify_mt3_frozen_native.py \
            --target "$REVIEW_TARGET" \
            --checkpoint-dir "$MT3_CHECKPOINT_DIR" \
            --output "$RUNNER_TEMP/MT3-FROZEN-NATIVE-QA-$REVIEW_TARGET.pending.json"

      - name: Publish only pending JSON, not the frozen executable
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mt3-frozen-native-qa-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/MT3-FROZEN-NATIVE-QA-${{ matrix.target }}.pending.json
            ${{ runner.temp }}/MR-MT3-SOURCE-EVIDENCE.pending.json
          if-no-files-found: warn
          retention-days: 14
