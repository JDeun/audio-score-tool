name: CocoChorales Original Reference MusicXML Roundtrip Control

# Calibration control for the score-vs-ground-truth F1 experiment.
# Real original author WAV/MIDI from immutable Git; NO neural model inference,
# no model weights, no source audio/reference MIDI or generated MusicXML uploads.
on:
  pull_request:
    paths:
      - '.github/workflows/coco-reference-musicxml-control.yml'
      - 'scripts/score_cocochorales_musicxml_control.py'
      - 'tests/test_cocochorales_musicxml_control.py'
      - 'scripts/score_cocochorales_tiny.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coco-score-reference-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-control:
    name: original MIDI to MusicXML and back, four private train samples
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source verifier and converter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python 3.11 (same score codec version as model experiment)
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Install score conversion and source verification only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'music21==10.5.0' 'mido==1.3.3' 'defusedxml==0.7.1' -e .
          python -c 'from scripts.score_cocochorales_musicxml_control import reference_roundtrip; print("Original-score control imported")'
      - name: Obtain and verify exact registered author WAV/MIDI, calculate codec-only F1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coco-control-download" "$RUNNER_TEMP/coco-control-reports"
          for track in string_track001010 brass_track049013 woodwind_track097010 random_track145011; do
            curl --fail --location --silent --show-error \
              --proto '=https' --proto-redir '=https' \
              --connect-timeout 30 --max-time 600 --retry 3 --retry-delay 3 \
              --output "$RUNNER_TEMP/coco-control-download/$track.zip" \
              "https://raw.githubusercontent.com/lukewys/lukewys.github.io/7a0b15e7be365a6b062027c38ce0f8d57ed1d98a/cocochorales/assets/sample_examples/pieces/$track.zip"
            python -m scripts.prepare_cocochorales_official_sample \
              --archive "$RUNNER_TEMP/coco-control-download/$track.zip" \
              --track-id "$track" \
              --corpus-root "$RUNNER_TEMP/coco-control-private-$track" \
              --metadata-root "$RUNNER_TEMP/coco-control-evidence-$track"
            python -m scripts.score_cocochorales_musicxml_control \
              --pairs "$RUNNER_TEMP/coco-control-evidence-$track/pairs.json" \
              --registry "$RUNNER_TEMP/coco-control-evidence-$track/reviewed-registry.json" \
              --source-proof "$RUNNER_TEMP/coco-control-evidence-$track/source-proof.pending.json" \
              --corpus-root "$RUNNER_TEMP/coco-control-private-$track" \
              --output "$RUNNER_TEMP/coco-control-reports/$track.pending.json"
          done
          python -m scripts.score_cocochorales_musicxml_control \
            --reports-root "$RUNNER_TEMP/coco-control-reports" \
            --output "$RUNNER_TEMP/coco-control-reports/aggregate.pending.json"
      - name: Upload only conversion-control JSON metrics, never media or model weights
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coco-reference-score-conversion-control-pending-${{ github.run_id }}
          path: ${{ runner.temp }}/coco-control-reports/*.pending.json
          if-no-files-found: warn
          retention-days: 30
