[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio-score-tool"
version = "0.8.0"
description = "Local-first desktop audio-to-sheet-music transcription, editing, and publishing workspace."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116",
  "mido>=1.3",
  "music21>=9.7,<11",
  "mutagen>=1.47",
  "numpy>=1.26,<3",
  "pillow>=11.0",
  "python-multipart>=0.0.20",
  "typer>=0.16",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "httpx2>=0.1",
  "ruff>=0.12",
]
desktop = [
  "pyinstaller>=6.15",
]
mt3 = [
  "mt3-infer[torch]==0.2.0",
]
# Compatibility alias for early v0.7 instructions.
yourmt3 = [
  "mt3-infer[torch]==0.2.0",
]
native = [
  "torch>=2.7",
  "torchaudio>=2.7",
]

[project.scripts]
audio-score = "audio_score_tool.cli:app"
audio-score-api = "audio_score_tool.api_ext:run"
audio-score-native = "audio_score_tool.native_cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_score_tool"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep CI semantics stable across Ruff releases. These rules cover syntax/import
# correctness and import hygiene; deeper correctness is enforced by pytest and
# targeted security/data-integrity tests rather than newly-added style rules.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/audio_score_tool/auto_chords.py" = ["FURB192"]
"src/audio_score_tool/musicxml_parts.py" = ["SIM114"]
"src/audio_score_tool/score_structure.py" = ["RUF046"]
