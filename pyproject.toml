[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio-score-tool"
version = "0.4.0"
description = "Local-first desktop audio-to-sheet-music transcription, editing, and publishing workspace."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116",
  "mido>=1.3",
  "python-multipart>=0.0.20",
  "typer>=0.16",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "httpx2>=0.1",
  "ruff>=0.12",
]
desktop = [
  "pyinstaller>=6.15",
]

[project.scripts]
audio-score = "audio_score_tool.cli:app"
audio-score-api = "audio_score_tool.api_ext:run"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_score_tool"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
