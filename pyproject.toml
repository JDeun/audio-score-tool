[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio-score-tool"
version = "0.8.0"
description = "Local-first desktop audio-to-sheet-music transcription, editing, and publishing workspace."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116",
  "fpdf2>=2.8.8,<3",
  "huggingface-hub>=0.34,<2",
  "mido>=1.3",
  "music21>=9.7,<11",
  "mutagen>=1.47",
  "numpy>=1.26,<3",
  "pillow>=11.0",
  "python-multipart>=0.0.20",
  "typer>=0.16",
  "uvicorn[standard]>=0.35",
  "verovio>=6.3,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "httpx2>=2.12,<3",
  "ruff>=0.12",
]
desktop = [
  "pyinstaller>=6.15",
]
mt3 = [
  "mt3-infer[torch]==0.2.0",
]
# Compatibility alias for early v0.7 instructions.
yourmt3 = [
  "mt3-infer[torch]==0.2.0",
]
native = [
  "torch>=2.7",
  "torchaudio>=2.7",
]

[project.scripts]
audio-score = "audio_score_tool.cli:app"
audio-score-api = "audio_score_tool.api_ext:run"
audio-score-native = "audio_score_tool.native_cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_score_tool"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
  "error",
  # Starlette 1.6.0 calls asyncio.iscoroutinefunction on Python 3.12; AnyIO emits this
  # upstream deprecation. Keep the exception narrow so every other warning remains fatal.
  "ignore:'asyncio.iscoroutinefunction' is deprecated.*:DeprecationWarning:starlette\\.testclient",
  # Starlette 1.6.0 still imports AnyIO's deprecated BlockingPortal compatibility alias.
  # Ignore only that exact upstream alias warning; all other deprecations stay fatal.
  "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep CI semantics stable across Ruff releases. These rules cover syntax/import
# correctness and import hygiene; deeper correctness is enforced by pytest and
# targeted security/data-integrity tests rather than newly-added style rules.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/audio_score_tool/auto_chords.py" = ["FURB192"]
"src/audio_score_tool/musicxml_parts.py" = ["SIM114"]
"src/audio_score_tool/score_structure.py" = ["RUF046"]
