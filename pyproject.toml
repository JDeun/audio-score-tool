[project]
name = "audio-score-tool"
version = "0.8.0"
description = "Audio to sheet music pipeline (YouTube/local audio -> MIDI/MusicXML)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "requests>=2.32",
  "httpx>=0.27",
  "numpy>=1.26,<2.1",
  "scipy>=1.12",
  "librosa>=0.10.2",
  "soundfile>=0.12",
  "pretty-midi>=0.2.10",
  "mido>=1.3",
  "music21>=9.1",
  "mir-eval>=0.7",
  "yt-dlp>=2025.1.15",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "defusedxml>=0.7.1",
  "psutil>=5.9",
  "platformdirs>=4.2",
  "verovio>=6.1,<7",
  "fpdf2>=2.8,<3",
]

[project.optional-dependencies]
# YourMT3+ integration. Torch/torchaudio are installed per-platform in Dockerfile.
yourmt3 = [
  "einops>=0.7",
  "transformers>=4.41",
  "sentencepiece>=0.2",
  "safetensors>=0.4",
]

# WhisperX lyrics alignment (optional; can be heavy)
lyrics = [
  "whisperx>=3.1",
]

# Native model training (Phase 3+)
native-train = [
  "torch>=2.2",
  "torchaudio>=2.2",
  "tensorboard>=2.16",
]

dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
audio-score = "audio_score_tool.cli:app"
audio-score-native = "audio_score_tool.native_cli:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
  "error",
  # Starlette 1.6.0 calls asyncio.iscoroutinefunction on Python 3.12; AnyIO emits this
  # upstream deprecation. Keep the exception narrow so every other warning remains fatal.
  "ignore:'asyncio.iscoroutinefunction' is deprecated.*:DeprecationWarning:starlette\\.testclient",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
